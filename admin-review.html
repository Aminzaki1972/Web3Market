<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Review Center | Web3Market</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--p:#7c3aed;--b:#2563eb;--bg:#090a14;--card:#15132a;--line:#34295b;--text:#f6f3ff;--muted:#aaa3bd}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 0%,#3d2370,transparent 30%),radial-gradient(circle at 90% 0%,#163d72,transparent 30%),linear-gradient(135deg,#090a14,#151027 65%,#0b1222);min-height:100vh}.top{height:68px;padding:0 20px;border-bottom:1px solid var(--line);background:#0c0b19ee;display:flex;align-items:center;justify-content:space-between}.brand{color:#fff;text-decoration:none;font-weight:900}.mark{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;margin-right:8px;background:linear-gradient(135deg,var(--p),var(--b))}.wrap{max-width:1150px;margin:auto;padding:26px 14px}.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.eyebrow{color:#a78bfa;font-size:11px;font-weight:900;letter-spacing:2px}.head h1{margin:7px 0;font-size:30px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:linear-gradient(145deg,#1a1730,#121a2b);border:1px solid var(--line);border-radius:16px;padding:18px}.title{font-size:19px;font-weight:900}.row{display:flex;justify-content:space-between;gap:12px;margin:9px 0;font-size:12px}.pill{padding:6px 9px;border-radius:20px;background:#7c3aed22;color:#c4b5fd;font-weight:900}.score{font-size:25px;font-weight:900}.btn{border:1px solid #40345f;background:#18152b;color:#eee8f7;border-radius:9px;padding:10px 13px;font-size:12px;font-weight:900;cursor:pointer}.approve{background:#16794a;border-color:#16794a}.changes{background:#8a5a08;border-color:#8a5a08}.reject{background:#8f2637;border-color:#8f2637}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.empty{text-align:center;padding:40px}.error{color:#ff9aa8}.full{grid-column:1/-1}.details{margin-top:12px;border-top:1px solid #30264d;padding-top:12px}.details summary{cursor:pointer;color:#c4b5fd;font-weight:800;font-size:12px}.details pre{white-space:pre-wrap;word-break:break-word;font-size:10px;color:#cfc8dc;background:#0d0c19;padding:10px;border-radius:9px;max-height:280px;overflow:auto}.note{width:100%;margin-top:8px;padding:10px;border:1px solid #3a3158;border-radius:9px;background:#0d0c19;color:#f5f2ff;min-height:60px}.toolbar{display:flex;gap:8px;align-items:center}.count{font-weight:900;color:#c4b5fd}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{display:block}.head h1{font-size:25px}.toolbar{margin-top:12px}.actions{flex-direction:column}.actions .btn{width:100%}}</style></head><body><header class="top"><a class="brand" href="marketplace.html"><span class="mark">W3</span>Web3Market</a><span class="pill">ADMIN REVIEW CENTER</span></header><main class="wrap"><section class="head"><div><div class="eyebrow">TRUST & SAFETY</div><h1>Project Review Center</h1><div id="status" class="muted">Checking administrator access...</div></div><div class="toolbar"><span id="count" class="count">0 pending</span><button class="btn" onclick="loadProjects()">Refresh</button></div></section><section id="list" class="grid"><div class="card empty muted full">Loading review queue...</div></section></main><script>const SB_URL='https://hzhqlexnhtukfljcvnyd.supabase.co',SB_KEY='sb_publishable_lO7uEsiM0T8oeHB75DMxkA_287VZ9eI',db=supabase.createClient(SB_URL,SB_KEY),FN=SB_URL+'/functions/v1/admin-review',$=s=>document.querySelector(s);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]) )}async function call(action,extra={}){const {data:{session}}=await db.auth.getSession();if(!session)throw new Error('Please sign in with the administrator account.');const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...extra})});const j=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw new Error(j.error||'Admin request failed');return j}async function loadProjects(){try{const {data:{session}}=await db.auth.getSession();if(!session){$('#status').innerHTML='<span class="error">Please sign in.</span>';$('#list').innerHTML='<div class="card empty error full">Sign in first, then open Admin Review Center.</div>';return}const j=await call('list');$('#status').textContent='Administrator access verified ✓';$('#count').textContent=(j.projects?.length||0)+' pending';if(!j.projects?.length){$('#list').innerHTML='<div class="card empty muted full">No projects are waiting for admin review.</div>';return}$('#list').innerHTML=j.projects.map(p=>`<article class="card"><div class="title">${esc(p.title||'Untitled Project')}</div><div class="muted">${esc(p.short_description||'No short description')}</div><div class="row"><span>AI Review</span><span class="score">${esc(p.ai_score??'—')}/100</span></div><div class="row"><span>AI Status</span><span class="pill">${esc(p.ai_status||'pending')}</span></div><div class="row"><span>Project Status</span><span>${esc(p.project_status||p.status||'—')}</span></div><div class="row"><span>Price</span><span>${esc(p.asking_price??p.price??'—')} ${esc(p.currency_code||p.currency||'USD')}</span></div><div class="row"><span>Website</span><span>${p.website_url?'✓':'—'}</span></div><details class="details"><summary>View complete project data</summary><pre>${esc(JSON.stringify(p,null,2))}</pre></details><textarea id="note-${p.id}" class="note" placeholder="Admin note (required for changes/rejection)"></textarea><div class="actions"><button class="btn approve" onclick="decide('${p.id}','approved')">✓ Approve Listing</button><button class="btn changes" onclick="decide('${p.id}','changes_requested')">↻ Request Changes</button><button class="btn reject" onclick="decide('${p.id}','rejected')">✕ Reject</button></div></article>`).join('')}catch(e){$('#status').innerHTML='<span class="error">'+esc(e.message)+'</span>';$('#list').innerHTML='<div class="card error full">'+esc(e.message)+'</div>'}}async function decide(id,action){const note=document.getElementById('note-'+id)?.value.trim()||'';if(action!=='approved'&&!note){alert('Please enter an admin note explaining the required changes or rejection reason.');return}const label=action==='approved'?'approve this listing':action==='changes_requested'?'request changes for this project':'reject this project';if(!confirm('Are you sure you want to '+label+'?'))return;try{await call(action,{project_id:id,admin_notes:note});await loadProjects()}catch(e){alert(e.message)}}loadProjects();</script></body></html>
