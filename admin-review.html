<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Review | Web3Market</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--p:#7c3aed;--b:#2563eb;--bg:#090a14;--card:#15132a;--line:#34295b;--text:#f6f3ff;--muted:#aaa3bd}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 0%,#3d2370,transparent 30%),radial-gradient(circle at 90% 0%,#163d72,transparent 30%),linear-gradient(135deg,#090a14,#151027 65%,#0b1222);min-height:100vh}.top{height:68px;padding:0 20px;border-bottom:1px solid var(--line);background:#0c0b19ee;display:flex;align-items:center;justify-content:space-between}.brand{color:#fff;text-decoration:none;font-weight:900}.mark{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;margin-right:8px;background:linear-gradient(135deg,var(--p),var(--b))}.wrap{max-width:1100px;margin:auto;padding:26px 14px}.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.eyebrow{color:#a78bfa;font-size:11px;font-weight:900;letter-spacing:2px}.head h1{margin:7px 0;font-size:30px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:linear-gradient(145deg,#1a1730,#121a2b);border:1px solid var(--line);border-radius:16px;padding:18px}.title{font-size:19px;font-weight:900}.row{display:flex;justify-content:space-between;gap:12px;margin:9px 0;font-size:12px}.pill{padding:6px 9px;border-radius:20px;background:#7c3aed22;color:#c4b5fd;font-weight:900}.score{font-size:24px;font-weight:900}.btn{border:1px solid #40345f;background:#18152b;color:#eee8f7;border-radius:9px;padding:10px 13px;font-size:12px;font-weight:900;cursor:pointer}.approve{background:#16794a;border-color:#16794a}.changes{background:#8a5a08;border-color:#8a5a08}.reject{background:#8f2637;border-color:#8f2637}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.empty{text-align:center;padding:40px}.error{color:#ff9aa8}.full{grid-column:1/-1}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{display:block}.head h1{font-size:25px}}
</style></head><body><header class="top"><a class="brand" href="seller-dashboard.html"><span class="mark">W3</span>Web3Market</a><span class="pill">ADMIN REVIEW</span></header><main class="wrap"><section class="head"><div><div class="eyebrow">TRUST & SAFETY</div><h1>Project Review Center</h1><div id="status" class="muted">Checking administrator access...</div></div><button class="btn" onclick="loadProjects()">Refresh</button></section><section id="list" class="grid"><div class="card empty muted">Loading review queue...</div></section></main><script>const SB_URL='https://hzhqlexnhtukfljcvnyd.supabase.co',SB_KEY='sb_publishable_lO7uEsiM0T8oeHB75DMxkA_287VZ9eI',db=supabase.createClient(SB_URL,SB_KEY),$=s=>document.querySelector(s);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}function score(p){let s=0;const checks=[p.title,p.short_description,p.website_url,p.description,p.target_markets,p.business_model,p.transfer_terms,p.price,p.verification?.declaration];checks.forEach(v=>{if(v!==null&&v!==undefined&&v!=='')s+=10});if((p.social_accounts&&Object.keys(p.social_accounts).length))s+=10;if((p.project_types||[]).length)s+=10;return Math.min(100,s)}async function guard(){const {data:{user}}=await db.auth.getUser();if(!user){$('#status').innerHTML='<span class="error">Please sign in.</span>';return false}const {data:p,error}=await db.from('profiles').select('role,display_name').eq('id',user.id).maybeSingle();if(error||!p||String(p.role||'').toLowerCase()!=='admin'){$('#status').innerHTML='<span class="error">Administrator access required.</span>';return false}$('#status').textContent='Administrator access verified ✓';return true}async function loadProjects(){if(!(await guard()))return;const {data,error}=await db.from('projects').select('*').in('status',['ai_review','admin_review']).order('created_at',{ascending:false});if(error){$('#list').innerHTML='<div class="card error full">'+esc(error.message)+'</div>';return}if(!data?.length){$('#list').innerHTML='<div class="card empty muted full">No projects are waiting for review.</div>';return}$('#list').innerHTML=data.map(p=>{const sc=Number(p.ai_score??score(p));const f=p.financials||{};return `<article class="card"><div class="title">${esc(p.title||'Untitled Project')}</div><div class="muted">${esc(p.short_description||'No short description')}</div><div class="row"><span>Status</span><span class="pill">${esc(p.status||'')}</span></div><div class="row"><span>Automated completeness</span><span class="score">${sc}%</span></div><div class="row"><span>Website</span><span>${p.website_url?'✓':'—'}</span></div><div class="row"><span>Price</span><span>${p.price??'—'} ${esc(p.currency||'')}</span></div><div class="row"><span>Financials</span><span>${f.monthly_revenue!=null?'Provided':'Not provided'}</span></div><div class="actions"><button class="btn approve" onclick="decide('${p.id}','approved')">Approve</button><button class="btn changes" onclick="decide('${p.id}','changes_requested')">Request Changes</button><button class="btn reject" onclick="decide('${p.id}','rejected')">Reject</button></div></article>`}).join('')}async function decide(id,status){let note='';if(status!=='approved'){note=prompt(status==='rejected'?'Reason for rejection:':'What must the seller change?')||''}const {error}=await db.from('projects').update({status,admin_notes:note,ai_status:status==='approved'?'passed':'needs_attention'}).eq('id',id);if(error){alert(error.message);return}await loadProjects()}loadProjects();</script></body></html>
