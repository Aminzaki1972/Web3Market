<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password — Web3Market</title><link rel="stylesheet" href="css/style.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#07111f;color:#f8fafc;font-family:Inter,system-ui,sans-serif}.card{width:min(100%,460px);padding:36px;border:1px solid rgba(148,163,184,.16);border-radius:22px;background:#0d1b2d;box-shadow:0 20px 60px rgba(0,0,0,.28)}h1{margin:0 0 10px;font-size:32px}p{color:#94a3b8;line-height:1.6}.field{margin:22px 0}.field label{display:block;margin-bottom:8px;color:#cbd5e1;font-weight:600;font-size:14px}.field input{width:100%;padding:15px;border-radius:12px;border:1px solid rgba(148,163,184,.22);background:#07111f;color:#fff;box-sizing:border-box;font:inherit;outline:none}.btn{width:100%;padding:15px;border:0;border-radius:12px;font:inherit;font-weight:800;cursor:pointer;background:#38bdf8;color:#06101b}.btn:disabled{opacity:.55}.msg{display:none;margin-top:18px;padding:13px;border-radius:10px;font-size:14px;line-height:1.5}.msg.show{display:block}.ok{background:rgba(34,197,94,.08);color:#86efac}.err{background:rgba(239,68,68,.08);color:#fca5a5}.home{display:inline-block;margin-bottom:25px;color:#6ee7ff;text-decoration:none}.secondary{display:block;text-align:center;margin-top:12px;text-decoration:none;color:#cbd5e1;border:1px solid rgba(148,163,184,.22);padding:14px;border-radius:12px}</style></head><body><main class="card"><a class="home" href="login.html">← Back to login</a><h1>Forgot your password?</h1><p>Enter your account email and we will send you a secure link to create a new password.</p><form id="form" novalidate><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><button id="btn" class="btn" type="submit">Send reset link</button></form><div id="msg" class="msg" role="status" aria-live="polite"></div><a class="secondary" href="register.html">Create a new account</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20260822-9"></script><script>(async function(){const sb=window.Web3MarketSupabase?.getClient?.()||window.Web3MarketSupabase?.client||window.supabaseClient;const form=document.getElementById('form'),email=document.getElementById('email'),btn=document.getElementById('btn'),msg=document.getElementById('msg');function show(t,ok){msg.textContent=t;msg.className='msg show '+(ok?'ok':'err')}form.addEventListener('submit',async e=>{e.preventDefault();const value=email.value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value))return show('Please enter a valid email address.',false);if(!sb)return show('Unable to connect to Web3Market. Please refresh and try again.',false);btn.disabled=true;btn.textContent='Sending…';try{const {error}=await sb.auth.resetPasswordForEmail(value,{redirectTo:new URL('reset-password.html',location.href).href});if(error)throw error;show('Reset link sent. Check your email and click the link to open the password reset page.',true);form.reset()}catch(err){show(String(err?.message||'Unable to send reset link.'),false)}finally{btn.disabled=false;btn.textContent='Send reset link'}})})();</script></body></html>
