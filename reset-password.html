<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — Web3Market</title><link rel="stylesheet" href="css/style.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#07111f;color:#f8fafc;font-family:Inter,system-ui,sans-serif}.card{width:min(100%,460px);padding:36px;border:1px solid rgba(148,163,184,.16);border-radius:22px;background:#0d1b2d;box-shadow:0 20px 60px rgba(0,0,0,.28)}h1{margin:0 0 10px;font-size:32px}p{color:#94a3b8;line-height:1.6}.field{margin:22px 0}.field label{display:block;margin-bottom:8px;color:#cbd5e1;font-weight:600;font-size:14px}.field input{width:100%;padding:15px;border-radius:12px;border:1px solid rgba(148,163,184,.22);background:#07111f;color:#fff;box-sizing:border-box;font:inherit}.btn{width:100%;padding:15px;border:0;border-radius:12px;font:inherit;font-weight:800;cursor:pointer;background:#38bdf8;color:#06101b}.btn:disabled{opacity:.55}.msg{display:none;margin-top:18px;padding:13px;border-radius:10px;font-size:14px;line-height:1.5}.msg.show{display:block}.ok{background:rgba(34,197,94,.08);color:#86efac}.err{background:rgba(239,68,68,.08);color:#fca5a5}.home{display:inline-block;margin-bottom:25px;color:#6ee7ff;text-decoration:none}</style></head><body><main class="card"><a class="home" href="login.html">← Back to login</a><h1>Set a new password</h1><p>Choose a new secure password for your Web3Market account.</p><form id="form"><div class="field"><label for="password">New password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="8" required autocomplete="new-password"></div><button id="btn" class="btn" type="submit">Update password</button></form><div id="msg" class="msg" role="status" aria-live="polite"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20260822-10"></script><script>(async function(){const sb=window.Web3MarketSupabase?.getClient?.()||window.Web3MarketSupabase?.client||window.supabaseClient;const msg=document.getElementById('msg'),form=document.getElementById('form'),btn=document.getElementById('btn');function show(t,ok){msg.textContent=t;msg.className='msg show '+(ok?'ok':'err')}if(!sb)return show('Unable to connect to Web3Market.',false);try{const params=new URLSearchParams(location.search),code=params.get('code');if(code){const {error}=await sb.auth.exchangeCodeForSession(code);if(error)throw error;history.replaceState({},document.title,'reset-password.html')}const {data}=await sb.auth.getSession();if(!data?.session)throw new Error('This reset link is invalid or expired. Request a new one from the Forgot Password page.')}catch(err){form.style.display='none';return show(String(err?.message||'This reset link is invalid or expired. Request a new one.'),false)}form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<8)return show('Password must be at least 8 characters.',false);if(p!==c)return show('Passwords do not match.',false);btn.disabled=true;btn.textContent='Updating…';try{const {error}=await sb.auth.updateUser({password:p});if(error)throw error;show('Password updated successfully. You can now sign in.',true);setTimeout(async()=>{await sb.auth.signOut();location.replace('login.html')},1800)}catch(err){show(String(err?.message||'Unable to update password.'),false)}finally{btn.disabled=false;btn.textContent='Update password'}})})();</script></main></body></html>
