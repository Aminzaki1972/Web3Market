<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Private Web3Market support conversation with the administration">
<title>Private Support Chat | Web3Market</title>
<link rel="stylesheet" href="css/marketplace.css">
<style>
:root{color-scheme:light}body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,system-ui,sans-serif}.support-wrap{width:min(900px,94%);margin:28px auto}.support-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.support-head h1{margin:0;font-size:clamp(24px,5vw,34px)}.support-note{color:#64748b;line-height:1.6}.support-card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px #1720330b}.support-status{padding:14px 18px;background:#f8fafc;border-bottom:1px solid #e2e8f0;color:#475569;font-size:13px}.support-thread{height:min(56vh,560px);min-height:260px;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.msg{max-width:88%;padding:12px 14px;border-radius:14px;background:#f1f5f9;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.5}.msg.mine{align-self:flex-end;background:#eeebff}.msg small{display:block;margin-top:8px;color:#64748b;font-size:11px}.msg a{color:#4f46e5;font-weight:700}.composer{border-top:1px solid #e2e8f0;padding:14px;display:grid;gap:10px}.composer textarea{width:100%;min-height:88px;resize:vertical;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:12px;padding:12px;font:inherit}.composer-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.file-label,.send-btn,.back-btn{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:11px 14px;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none;border:1px solid #d8deea;background:white;color:#334155}.send-btn{background:#635bff;color:white;border-color:#635bff}.send-btn:disabled{opacity:.55;cursor:wait}.file-input{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}.file-input:focus-visible+ .file-name{outline:2px solid #635bff}.file-name{font-size:12px;color:#64748b;overflow-wrap:anywhere}.error{color:#b91c1c}.attachment{display:block;max-width:min(100%,360px);max-height:260px;margin-top:8px;border-radius:10px}.attachment-video{width:min(100%,360px);max-height:260px}.empty{color:#64748b;text-align:center;margin:auto;line-height:1.6}@media(max-width:520px){.support-wrap{margin:14px auto}.support-thread{padding:12px}.msg{max-width:94%}.composer{padding:10px}}
</style>
</head>
<body>
<main class="support-wrap">
<header class="support-head"><div><p style="margin:0 0 6px;color:#635bff;font-weight:900;font-size:11px;letter-spacing:1.5px">WEB3MARKET · PRIVATE</p><h1>Support Center</h1></div><a class="back-btn" href="marketplace.html">Back to marketplace</a></header>
<p class="support-note">This private conversation is visible only to you and authorized Web3Market administrators. You cannot message other buyers or sellers here.</p>
<section class="support-card" aria-label="Private support conversation">
<div id="supportStatus" class="support-status" role="status" aria-live="polite">Checking your secure session…</div>
<div id="supportThread" class="support-thread"><div class="empty">Loading your conversation…</div></div>
<form id="supportForm" class="composer">
<textarea id="supportBody" maxlength="10000" placeholder="Write a message to the Web3Market team…" aria-label="Message"></textarea>
<div class="composer-row">
<button id="supportNewConversation" class="back-btn" type="button" hidden>Request new conversation</button>
<label class="file-label" for="supportFile">Attach photo/video</label>
<input id="supportFile" class="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime">
<span id="supportFileName" class="file-name">No file selected</span>
<button id="supportSend" class="send-btn" type="submit">Send message</button>
</div>
<div id="supportError" class="error" role="alert"></div>
</form>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20261021-support2"></script><script src="js/support-chat.js?v=20261021-support-email1"></script><script src="js/support-calls.js?v=20261021-support-calls3"></script>
</body></html>
