<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web3Market — Social Sign In</title><link rel="stylesheet" href="css/style.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7fb;color:#172033;font-family:Inter,system-ui}.card{width:min(100%,460px);padding:32px;background:#fff;border:1px solid #e5e9f0;border-radius:18px;text-align:center;box-shadow:0 16px 45px rgba(20,30,50,.1)}.spin{width:34px;height:34px;border:4px solid #e5e7eb;border-top-color:#635bff;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.err{color:#b42318}.btn{display:inline-block;margin-top:16px;padding:12px 18px;border-radius:10px;background:#635bff;color:#fff;text-decoration:none}</style></head><body><main class="card"><div class="spin" id="spin"></div><h1 id="title">Completing social sign-in…</h1><p id="msg">Please wait while Web3Market verifies your account.</p><a id="back" class="btn" href="login.html" style="display:none">Back to login</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20260921-github1"></script><script>(async function(){const title=document.getElementById('title'),msg=document.getElementById('msg'),spin=document.getElementById('spin'),back=document.getElementById('back');const setErr=t=>{spin.style.display='none';title.textContent='Social sign-in failed';msg.textContent=t;msg.className='err';back.style.display='inline-block'};try{const sb=window.Web3MarketSupabase?.getClient?.();if(!sb)throw new Error('Web3Market Auth client unavailable.');await new Promise(r=>setTimeout(r,250));const {data,error}=await sb.auth.getSession();if(error)throw error;const session=data?.session;if(!session?.user)throw new Error('No authenticated GitHub session was returned.');const user=session.user;const provider=String(user.app_metadata?.provider||'').toLowerCase();if(provider!=='github'&&provider!=='google')throw new Error('Unsupported authentication provider.');const {data:profile,error:pe}=await sb.from('profiles').select('role,created_at').eq('id',user.id).maybeSingle();if(pe)throw pe;if(!profile)throw new Error('Your Web3Market profile could not be created.');let pendingRole='';try{pendingRole=(localStorage.getItem(provider==='google'?'web3market_google_role':'web3market_github_role')||'').toLowerCase()}catch(_){}const age=Date.now()-new Date(profile.created_at||user.created_at).getTime();const isNew=Number.isFinite(age)&&age>=0&&age<15*60*1000;if(isNew&&pendingRole){try{const {error:rpcError}=await sb.rpc('complete_social_registration',{p_provider:provider,p_role:pendingRole});if(rpcError)throw rpcError;profile.role=pendingRole}catch(e){console.warn('GitHub role completion:',e)}}try{localStorage.removeItem('web3market_github_role');localStorage.removeItem('web3market_google_role');sessionStorage.removeItem('web3market_github_flow');sessionStorage.removeItem('web3market_google_flow')}catch(_){}const role=String(profile.role||'buyer').toLowerCase();if(role==='admin')return location.replace('admin-review.html');if(role==='seller')return location.replace('seller-dashboard.html');return location.replace('buyer-dashboard.html')}catch(e){console.error('Web3Market GitHub callback:',e);setErr(e?.message||'Unable to complete GitHub sign-in.')}})();</script></body></html>
