"use strict";
(function(){
  const id=new URLSearchParams(location.search).get("id");
  const panel=document.getElementById("githubOwnerPanel"), input=document.getElementById("githubRepoInput"), btn=document.getElementById("saveGithubRepoBtn"), status=document.getElementById("githubRepoStatus");
  if(!id||!panel||!input||!btn)return;
  const getClient=()=>window.Web3MarketSupabase?.getClient?.()||window.supabaseClient||window.web3marketSupabase||null;
  const validGitHub=v=>/^https:\/\/github\.com\/[^/]+\/[^/]+(?:\/)?$/i.test(String(v||"").trim());
  async function init(){
    const c=getClient(); if(!c)return;
    const u=await c.auth.getUser(); if(u.error||!u.data?.user)return;

    if(p.github_url)status.textContent="GitHub is connected. You can replace it with another public repository.";
