<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard | Web3Market</title><link rel="stylesheet" href="css/marketplace.css"><style>
:root{--bg:#f6f8fc;--card:#fff;--border:#e7ebf3;--muted:#687386;--text:#111827;--accent:#2563eb}body{background:var(--bg);color:var(--text)}.seller-shell{max-width:1180px;margin:0 auto;padding:34px 20px 70px}.seller-hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:24px}.seller-hero h1{margin:7px 0;font-size:38px}.seller-hero p{color:var(--muted);margin:0}.seller-actions{display:flex;gap:10px;flex-wrap:wrap}.seller-btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border-radius:10px;text-decoration:none;border:1px solid var(--border);background:#fff;color:var(--text);font-weight:700}.seller-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat,.panel{background:var(--card);border:1px solid var(--border);border-radius:16px}.stat{padding:20px}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:27px;font-weight:800;margin-top:8px}.stat .sub{font-size:12px;color:var(--muted);margin-top:5px}.seller-grid{display:grid;grid-template-columns:1.45fr .85fr;gap:18px}.panel{padding:22px;margin-bottom:18px}.panel h2{font-size:19px;margin:0 0 16px}.profile{display:flex;gap:16px;align-items:center}.avatar{width:64px;height:64px;border-radius:16px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}.profile h3{margin:0 0 4px}.muted{color:var(--muted)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#ecfdf5;color:#047857;font-size:12px;font-weight:800}.score{font-size:30px;font-weight:800}.progress{height:8px;background:#eef1f6;border-radius:99px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:var(--accent);border-radius:99px}.listing{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-top:1px solid var(--border)}.listing:first-of-type{border-top:0}.listing h3{font-size:15px;margin:0 0 5px}.listing a{color:inherit;text-decoration:none}.status-pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#f1f5f9;white-space:nowrap;height:max-content}.quick-links{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick-links a{padding:13px;border:1px solid var(--border);border-radius:11px;text-decoration:none;color:inherit;font-weight:700}.empty{padding:20px;border:1px dashed var(--border);border-radius:12px;color:var(--muted)}
@media(max-width:800px){.seller-hero{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.seller-grid{grid-template-columns:1fr}.seller-hero h1{font-size:31px}}@media(max-width:480px){.stats{grid-template-columns:1fr}.seller-shell{padding:24px 14px}.quick-links{grid-template-columns:1fr}}
</style></head>
