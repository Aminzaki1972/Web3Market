<body>
<header class="topbar"><a class="brand" href="index.html">Web3<i>Market</i></a><nav class="nav"><a href="marketplace.html">Marketplace</a><a href="ai-passport.html">AI Project Passport</a></nav><div class="grow"></div><a class="btn" href="index.html">← Web3Market</a></header>
<section class="hero"><div class="wrap"><h1>W3M Passport Directory</h1><p>Public registry of Web3 projects and organizations that have received a W3M Passport identity.</p><div class="stats"><div class="stat"><strong id="total">—</strong><span>W3M identities</span></div><div class="stat"><strong id="verified">—</strong><span>Verified Passports</span></div></div></div></section>
<main class="wrap"><div class="tools"><input id="search" class="search" type="search" placeholder="Search project name or Passport ID…" aria-label="Search project name or Passport ID"></div><section class="directory"><div id="grid" class="grid"><div class="empty">Loading W3M Passport registry…</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="console.warn('Supabase CDN unavailable; using directory fallback data')"></script>
<script src="js/supabase.js?v=20261001-passport-directory"></script>
<script>
(function(){
'use strict';
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const client=()=>window.Web3MarketSupabase?.getClient?.();
let rows=[
 {identity_code:'W3M-2026-000001',sequence_no:1,project_name:'Web3Market',identity_status:'verified',created_at:'2026-09-24T22:24:00Z'},
 {identity_code:'W3M-2026-000002',sequence_no:2,project_name:'Uniswap',identity_status:'verified',created_at:'2026-09-24T22:24:00Z'},
 {identity_code:'W3M-2026-000003',sequence_no:3,project_name:'Web',identity_status:'probable',created_at:'2026-09-24T22:24:00Z'},
 {identity_code:'W3M-2026-000004',sequence_no:4,project_name:'Aave',identity_status:'verified',created_at:'2026-09-25T21:14:00Z'},
 {identity_code:'W3M-2026-000005',sequence_no:5,project_name:'Binance JavaScript & TypeScript SDK for Node.js | Siebly',identity_status:'verified',created_at:'2026-09-26T16:32:00Z'},
 {identity_code:'W3M-2026-000006',sequence_no:6,project_name:'Supabase',identity_status:'verified',created_at:'2026-09-26T17:28:00Z'},
 {identity_code:'W3M-2026-000007',sequence_no:7,project_name:'supabase-comments-extension',identity_status:'verified',created_at:'2026-09-26T21:22:00Z'},
 {identity_code:'W3M-2026-000008',sequence_no:8,project_name:'immutable',identity_status:'verified',created_at:'2026-09-27T20:20:00Z'},
 {identity_code:'W3M-2026-000009',sequence_no:9,project_name:'Arbitrum',identity_status:'verified',created_at:'2026-09-27T20:21:00Z'},
 {identity_code:'W3M-2026-000010',sequence_no:10,project_name:'Web3 Marketing Agency for Blockchain and Crypto Businesses - Web3 Marketo',identity_status:'verified',created_at:'2026-09-28T15:58:00Z'},
 {identity_code:'W3M-2026-000011',sequence_no:11,project_name:'ICANN Domain Registrar | Register & Manage Domains - NiceNIC',identity_status:'verified',created_at:'2026-09-30T19:08:00Z'},
 {identity_code:'W3M-2026-000012',sequence_no:12,project_name:'Sell Domains | Buy Domains | Park Domains - Afternic',identity_status:'verified',created_at:'2026-09-30T21:20:00Z'}
];
function fmt(v){try{return new Date(v).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})}catch{return '—'}}
function render(){
 const q=(document.getElementById('search').value||'').trim().toLowerCase();
 const filtered=rows.filter(x=>!q||String(x.project_name||'').toLowerCase().includes(q)||String(x.identity_code||'').toLowerCase().includes(q));
 const grid=document.getElementById('grid');
 if(!filtered.length){grid.innerHTML='<div class="empty">No W3M Passport identities match your search.</div>';return}
 grid.innerHTML=filtered.map(x=>{
  const verified=String(x.identity_status||'').toLowerCase()==='verified';
  return '<article class="card"><span class="badge '+(verified?'':'probable')+'">'+esc(verified?'✓ VERIFIED':'PROBABLE')+'</span><h2>'+esc(x.project_name||'Unnamed project')+'</h2><div class="code">'+esc(x.identity_code||'W3M Identity')+'</div><div class="date">Passport issued: '+esc(fmt(x.created_at))+'</div><a class="view" href="passport/'+encodeURIComponent(x.identity_code||'')+'/">View W3M Passport →</a></article>';
 }).join('');
}
async function load(attempt=0){
 const restUrl='https://hzhqlexnhtukfljcvnyd.supabase.co/rest/v1/project_identities?select=identity_code,sequence_no,project_name,identity_status,created_at&order=sequence_no.asc';
 const key='sb_publishable_lO7uEsiM0T8oeHB75DMxkA_287VZ9eI';
 try{
  const r=await fetch(restUrl,{headers:{apikey:key,Authorization:'Bearer '+key,Accept:'application/json'},cache:'no-store'});
  if(!r.ok)throw new Error('REST '+r.status);
  rows=await r.json();updateStats();render();return;
 }catch(restError){
  console.warn('Passport REST lookup failed:',restError);
  try{
   const c=client();
   if(c){
    const result=await Promise.race([
     c.from('project_identities').select('identity_code,sequence_no,project_name,identity_status,created_at').order('sequence_no',{ascending:true}),
     new Promise((_,reject)=>setTimeout(()=>reject(new Error('Supabase client timeout')),5000))
    ]);
    if(!result.error){rows=result.data||[];updateStats();render();return;}
    throw result.error;
   }
  }catch(clientError){console.warn('Passport client lookup failed:',clientError)}
 }
 if(attempt<8){setTimeout(()=>load(attempt+1),500);return}
 document.getElementById('grid').innerHTML='<div class="empty">Passport registry could not be loaded. Please refresh the page.</div>';
}

function updateStats(){
 document.getElementById('total').textContent=rows.length;
 document.getElementById('verified').textContent=rows.filter(x=>String(x.identity_status||'').toLowerCase()==='verified').length;
}
// Render immediately from the built-in verified registry, then refresh from Supabase.
updateStats();
render();
document.getElementById('search').addEventListener('input',render);
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load,{once:true});else load();
})();
</script>
