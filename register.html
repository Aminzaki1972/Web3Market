<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create a Web3Market buyer or seller account."><title>Create Account — Web3Market</title><link rel="stylesheet" href="css/style.css"><style>.auth-page{min-height:100vh;display:grid;place-items:center;padding:32px 18px}.auth-card{width:min(100%,520px);padding:38px;border:1px solid var(--border);border-radius:var(--radius-lg);background:rgba(13,27,45,.94);box-shadow:var(--shadow);backdrop-filter:blur(18px)}.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}.auth-mark{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--border-blue);border-radius:12px;color:var(--blue-light);background:rgba(56,189,248,.08);font-weight:900}.auth-brand strong{font-size:19px}.auth-brand span{color:var(--blue-light)}.auth-back{display:inline-block;margin-bottom:22px;color:var(--blue-light);font-size:14px}.auth-card h1{font-size:34px;letter-spacing:-1px;margin-bottom:8px}.auth-sub{color:var(--text-muted);margin-bottom:26px}.field{margin:18px 0}.field label,.role-label{display:block;margin-bottom:8px;color:var(--text-secondary);font-size:14px;font-weight:700}.field input{width:100%;padding:14px 15px;border:1px solid var(--border);border-radius:12px;background:var(--bg-primary);color:var(--text-primary);outline:none}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(56,189,248,.08)}.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.role input{position:absolute;opacity:0}.role label{display:block;padding:15px;border:1px solid var(--border);border-radius:13px;background:rgba(7,17,31,.7);text-align:center;cursor:pointer}.role label span{display:block;margin-top:4px;color:var(--text-muted);font-size:12px;font-weight:500}.role input:checked+label{border-color:var(--blue);background:rgba(56,189,248,.08);box-shadow:0 0 25px rgba(56,189,248,.07)}.auth-btn{width:100%;min-height:50px;margin-top:8px}.auth-secondary{display:block;text-align:center;margin-top:12px;padding:13px;border:1px solid var(--border);border-radius:11px;color:var(--text-secondary)}.auth-secondary:hover{border-color:var(--border-blue);color:var(--text-primary)}.auth-msg{display:none;margin-top:16px;padding:13px;border-radius:10px;font-size:14px}.auth-msg.show{display:block}.auth-msg.ok{background:rgba(34,197,94,.08);color:#86efac}.auth-msg.err{background:rgba(239,68,68,.08);color:#fca5a5}.auth-small{font-size:12px;color:var(--text-muted);text-align:center;margin-top:18px;line-height:1.6}.countdown{font-size:12px;color:var(--text-muted);margin-top:9px}@media(max-width:520px){.auth-card{padding:27px 21px}.roles{grid-template-columns:1fr}.auth-card h1{font-size:29px}}</style></head><body class="auth-page"><main class="auth-card"><a class="auth-back" href="index.html">← Back to Web3Market</a><div class="auth-brand"><div class="auth-mark">W3M</div><strong>Web3<span>Market</span></strong></div><h1>Create your account</h1><p class="auth-sub">Join Web3Market as a buyer or seller.</p><form id="registerForm" novalidate><div class="field"><span class="role-label">Account type</span><div class="roles"><div class="role"><input id="roleBuyer" name="role" type="radio" value="buyer"><label for="roleBuyer">Buyer<span>Buy Web3 projects and services</span></label></div><div class="role"><input id="roleSeller" name="role" type="radio" value="seller"><label for="roleSeller">Seller<span>Sell Web3 projects and services</span></label></div></div></div><div class="field"><label for="fullName">Full name</label><input id="fullName" name="fullName" type="text" required minlength="2" maxlength="120" autocomplete="name"></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" required minlength="8" autocomplete="new-password"></div><button id="emailSubmit" class="btn btn-primary btn-large auth-btn" type="submit">Create account</button><div id="countdown" class="countdown"></div></form><div id="message" class="auth-msg"></div><a class="auth-secondary" href="login.html">Already have an account? Sign in</a><p class="auth-small">After registration, we will send a confirmation link to your email. Opening it takes you to Web3Market login.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20260822-1"></script><script src="js/auth.js?v=20260822-2"></script><script>(function(){const f=document.getElementById('registerForm'),e=document.getElementById('email'),n=document.getElementById('fullName'),p=document.getElementById('password'),c=document.getElementById('confirmPassword'),b=document.getElementById('emailSubmit'),m=document.getElementById('message'),cd=document.getElementById('countdown'),K='web3market_register_email_cooldown';function show(t,ok){m.textContent=t;m.className='auth-msg show '+(ok?'ok':'err')}function sb(){return window.Web3MarketSupabase?.getClient?.()||window.Web3MarketSupabase?.client||window.supabaseClient||null}function left(){return Math.max(0,Math.ceil((Number(localStorage.getItem(K)||0)-Date.now())/1000))}function tick(){const x=left();b.disabled=x>0;cd.textContent=x?'Please wait '+x+' seconds before requesting another email.':''}tick();setInterval(tick,1000);f.addEventListener('submit',async x=>{x.preventDefault();if(left())return;const r=document.querySelector('input[name="role"]:checked')?.value||'',name=n.value.trim(),mail=e.value.trim().toLowerCase();if(!r)return show('Please choose Buyer or Seller.',false);if(name.length<2)return show('Please enter your full name.',false);if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail))return show('Please enter a valid email address.',false);if(p.value.length<8)return show('Password must be at least 8 characters.',false);if(p.value!==c.value)return show('Passwords do not match.',false);const client=sb();if(!client)return show('Unable to connect to Web3Market.',false);b.disabled=true;b.textContent='Creating…';try{localStorage.setItem('web3market_pending_registration',JSON.stringify({email:mail,role:r,fullName:name,createdAt:Date.now()}));const redirect=new URL('login.html',location.href).href;const {data,error}=await client.auth.signUp({email:mail,password:p.value,options:{emailRedirectTo:redirect,data:{role:r,full_name:name,registration_method:'email',web3market_account:true}}});if(error)throw error;localStorage.setItem(K,String(Date.now()+60000));show(data?.session?'Account created. Please sign in.':'Account created. Check your email, confirm your account, then sign in.',true);f.reset()}catch(err){show(String(err?.message||'Account creation failed.'),false)}finally{b.textContent='Create account';tick()}})})();</script></body></html>
