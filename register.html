<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Create a Web3Market account with email or Web3 wallet.">
<title>Create Account — Web3Market</title>
<link rel="stylesheet" href="css/style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#07111f;color:#f8fafc;font-family:Inter,system-ui,sans-serif}.card{width:min(100%,520px);padding:36px;border:1px solid rgba(148,163,184,.16);border-radius:22px;background:#0d1b2d;box-shadow:0 20px 60px rgba(0,0,0,.28)}h1{margin:0 0 10px;font-size:34px}p{color:#94a3b8;line-height:1.6}.field{margin:20px 0}.field label{display:block;margin-bottom:8px;color:#cbd5e1;font-weight:600;font-size:14px}.field input{width:100%;padding:15px;border-radius:12px;border:1px solid rgba(148,163,184,.22);background:#07111f;color:#fff;box-sizing:border-box;font:inherit;outline:none}.field input:focus{border-color:#38bdf8}.btn{width:100%;padding:15px;border:0;border-radius:12px;font:inherit;font-weight:800;cursor:pointer}.primary{background:#38bdf8;color:#06101b}.secondary{display:block;text-align:center;margin-top:12px;text-decoration:none;color:#cbd5e1;border:1px solid rgba(148,163,184,.22);padding:14px;border-radius:12px}.divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:#64748b;font-size:12px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:rgba(148,163,184,.16)}.wallet{background:transparent;color:#6ee7ff;border:1px solid rgba(110,231,255,.25)}.msg{display:none;margin-top:18px;padding:13px;border-radius:10px;font-size:14px;line-height:1.5}.msg.show{display:block}.ok{background:rgba(34,197,94,.08);color:#86efac}.err{background:rgba(239,68,68,.08);color:#fca5a5}.home{display:inline-block;margin-bottom:25px;color:#6ee7ff;text-decoration:none}.small{font-size:12px;color:#64748b;margin-top:16px}
</style>
</head>
<body>
<main class="card">
<a class="home" href="index.html">← Web3Market</a>
<h1>Create your account</h1>
<p>Choose email to create your account, or connect a Web3 wallet.</p>
<form id="registerForm" novalidate>
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
<button id="emailSubmit" class="btn primary" type="submit">Create account with email</button>
</form>
<div id="message" class="msg" role="status" aria-live="polite"></div>
<div class="divider"><span>OR</span></div>
<button id="walletButton" class="btn wallet" type="button">Create account with Web3 wallet</button>
<a class="secondary" href="login.html">Already have an account? Sign in</a>
<p class="small">We use a secure one-time verification link. Never share your verification link with anyone.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
(function(){
 const form=document.getElementById('registerForm'),email=document.getElementById('email'),button=document.getElementById('emailSubmit'),wallet=document.getElementById('walletButton'),msg=document.getElementById('message');
 function show(text,ok){msg.textContent=text;msg.className='msg show '+(ok?'ok':'err')}
 function client(){return window.Web3MarketSupabase?.getClient?.()||window.supabaseClient||null}
 form.addEventListener('submit',async function(e){e.preventDefault();const value=email.value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)){show('Please enter a valid email address.',false);return}const sb=client();if(!sb){show('Unable to connect to Web3Market. Please refresh and try again.',false);return}button.disabled=true;button.textContent='Sending…';try{const {error}=await sb.auth.signInWithOtp({email:value,options:{shouldCreateUser:true,emailRedirectTo:new URL('index.html',location.href).href,data:{role:'individual'}}});if(error)throw error;show('Account created. Check your email and open the verification link on this device.',true);form.reset()}catch(err){show(String(err?.message||'Account creation failed.'),false)}finally{button.disabled=false;button.textContent='Create account with email'}});
 wallet.addEventListener('click',function(){show('Wallet registration is available through the wallet flow. Email registration is the recommended fallback.',false);});
})();
</script>
</body>
</html>
