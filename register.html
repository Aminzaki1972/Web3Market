<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create a Web3Market buyer or seller account with email."><title>Create Account — Web3Market</title><link rel="stylesheet" href="css/style.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#07111f;color:#f8fafc;font-family:Inter,system-ui,sans-serif}.card{width:min(100%,520px);padding:36px;border:1px solid rgba(148,163,184,.16);border-radius:22px;background:#0d1b2d;box-shadow:0 20px 60px rgba(0,0,0,.28)}h1{margin:0 0 10px;font-size:34px}p{color:#94a3b8;line-height:1.6}.field{margin:20px 0}.field label{display:block;margin-bottom:8px;color:#cbd5e1;font-weight:600;font-size:14px}.field input{width:100%;padding:15px;border-radius:12px;border:1px solid rgba(148,163,184,.22);background:#07111f;color:#fff;box-sizing:border-box;font:inherit;outline:none}.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.role input{position:absolute;opacity:0}.role label{display:block;padding:16px;border-radius:14px;border:1px solid rgba(148,163,184,.22);background:#07111f;cursor:pointer;color:#cbd5e1;text-align:center;font-weight:800}.role label span{display:block;font-size:12px;color:#64748b;font-weight:500;margin-top:5px}.role input:checked+label{border-color:#38bdf8;background:rgba(56,189,248,.08);color:#fff}.btn{width:100%;padding:15px;border:0;border-radius:12px;font:inherit;font-weight:800;cursor:pointer}.primary{background:#38bdf8;color:#06101b}.secondary{display:block;text-align:center;margin-top:12px;text-decoration:none;color:#cbd5e1;border:1px solid rgba(148,163,184,.22);padding:14px;border-radius:12px}.divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:#64748b;font-size:12px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:rgba(148,163,184,.16)}.wallet{background:transparent;color:#6ee7ff;border:1px solid rgba(110,231,255,.25)}.msg{display:none;margin-top:18px;padding:13px;border-radius:10px;font-size:14px;line-height:1.5}.msg.show{display:block}.ok{background:rgba(34,197,94,.08);color:#86efac}.err{background:rgba(239,68,68,.08);color:#fca5a5}.home{display:inline-block;margin-bottom:25px;color:#6ee7ff;text-decoration:none}.small,.countdown{font-size:12px;color:#64748b;margin-top:16px}</style></head><body><main class="card"><a class="home" href="index.html">← Web3Market</a><h1>Create your account</h1><p>Choose Buyer or Seller and create your Web3Market account with email and password.</p><form id="registerForm" novalidate><div class="field"><span class="role-label">Account type</span><div class="roles"><div class="role"><input id="roleBuyer" name="role" type="radio" value="buyer"><label for="roleBuyer">Buyer<span>Buy Web3 projects and services</span></label></div><div class="role"><input id="roleSeller" name="role" type="radio" value="seller"><label for="roleSeller">Seller<span>Sell Web3 projects and services</span></label></div></div></div><div class="field"><label for="fullName">Full name</label><input id="fullName" name="fullName" type="text" required minlength="2" maxlength="120"></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="8"></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" required minlength="8"></div><button id="emailSubmit" class="btn primary" type="submit">Create account</button><div id="countdown" class="countdown"></div></form><div id="message" class="msg"></div><div class="divider"><span>OR</span></div><button id="walletButton" class="btn wallet" type="button">Connect Wallet After Choosing a Role</button><a class="secondary" href="login.html">Already have an account? Sign in</a><p class="small">After registration, we will email you a confirmation link. Opening it takes you to Web3Market login.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20260822-1"></script><script src="wallet.js?v=20260821-1"></script><script src="js/auth.js?v=20260822-2"></script><script>(function(){const form=document.getElementById('registerForm'),email=document.getElementById('email'),fullName=document.getElementById('fullName'),password=document.getElementById('password'),confirmPassword=document.getElementById('confirmPassword'),button=document.getElementById('emailSubmit'),wallet=document.getElementById('walletButton'),msg=document.getElementById('message'),countdown=document.getElementById('countdown'),COOLDOWN=60,KEY='web3market_register_email_cooldown';let timer=null;function show(t,ok){msg.textContent=t;msg.className='msg show '+(ok?'ok':'err')}function client(){return window.Web3MarketSupabase?.getClient?.()||window.Web3MarketSupabase?.client||window.supabaseClient||null}function role(){return document.querySelector('input[name="role"]:checked')?.value||''}function left(){return Math.max(0,Math.ceil((Number(localStorage.getItem(KEY)||0)-Date.now())/1000))}function cooldown(){const l=left();button.disabled=l>0;countdown.textContent=l?'Please wait '+l+' seconds before requesting another email.':''}cooldown();timer=setInterval(cooldown,1000);form.addEventListener('submit',async e=>{e.preventDefault();if(left())return;const r=role(),name=fullName.value.trim(),v=email.value.trim().toLowerCase(),p=password.value;if(!r)return show('Please choose Buyer or Seller.',false);if(name.length<2)return show('Please enter your full name.',false);if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))return show('Please enter a valid email address.',false);if(p.length<8)return show('Password must be at least 8 characters.',false);if(p!==confirmPassword.value)return show('Passwords do not match.',false);const sb=client();if(!sb)return show('Unable to connect to Web3Market.',false);button.disabled=true;button.textContent='Creating…';try{localStorage.setItem('web3market_pending_registration',JSON.stringify({email:v,role:r,fullName:name,createdAt:Date.now()}));const redirect=new URL('login.html',location.href).href;const {data,error}=await sb.auth.signUp({email:v,password:p,options:{emailRedirectTo:redirect,data:{role:r,full_name:name,registration_method:'email',web3market_account:true}}});if(error)throw error;localStorage.setItem(KEY,String(Date.now()+60000));if(data?.session){await window.Web3MarketAuth.completeRegistration();show('Account created. Please sign in.',true)}else show('Account created. Check your email and confirm your account. Then sign in.',true);form.reset()}catch(err){show(String(err?.message||'Account creation failed.'),false)}finally{button.textContent='Create account';cooldown()}});wallet.addEventListener('click',async()=>{const r=role();if(!r)return show('Please choose Buyer or Seller first.',false);show('Wallet registration uses the selected role.',true)});})();</script></body></html>
