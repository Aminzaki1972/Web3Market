<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>List a Web3 Project | Web3Market</title><link rel="stylesheet" href="css/marketplace.css"></head>
<body><header class="topbar"><a class="brand" href="marketplace.html"><span class="brand-mark">W3</span><span>Web3Market</span></a><nav><a href="marketplace.html">Marketplace</a><a class="active" href="sell-project.html">Sell a Project</a></nav><a class="btn btn-ghost" href="register.html">Sign in</a></header>
<main><section class="hero-copy" style="max-width:820px;margin:0 auto"><span class="eyebrow">SELL YOUR WEB3 PROJECT</span><h1>Turn your Web3 project into a <span>market-ready listing.</span></h1><p>Provide transparent business and technical information. Your listing starts as a draft and can be published when ready.</p>
<form id="projectForm" class="card" style="margin-top:28px;gap:14px"><label>Project name<input required name="title" maxlength="160"></label><label>Short description<textarea required name="short_description" minlength="20" maxlength="500"></textarea></label><label>Full description<textarea required name="description" minlength="50" maxlength="20000"></textarea></label><div class="filters" style="margin:0"><label>Category<select required name="category"><option>DeFi</option><option>Web3 SaaS</option><option>DApp</option><option>Gaming</option><option>Infrastructure</option><option>NFT</option><option>Exchange</option><option>DAO</option><option>Other</option></select></label><label>Blockchain<input name="blockchain" placeholder="Ethereum, BNB Chain…"></label></div><div class="filters" style="margin:0"><label>Sale type<select name="sale_type"><option value="fixed_price">Fixed price</option><option value="make_offer">Make an offer</option><option value="auction">Auction</option><option value="private_sale">Private sale</option></select></label><label>Asking price<input name="asking_price" type="number" min="0" step="0.01" placeholder="USD"></label></div><div class="filters" style="margin:0"><label>Monthly revenue<input name="monthly_revenue" type="number" min="0" step="0.01"></label><label>Monthly profit<input name="monthly_profit" type="number" min="0" step="0.01"></label></div><div class="filters" style="margin:0"><label>Users<input name="users_count" type="number" min="0" step="1"></label><label>Monthly volume<input name="monthly_volume" type="number" min="0" step="0.01"></label></div><label>Project website<input name="project_url" type="url" placeholder="https://"></label><label>GitHub<input name="github_url" type="url" placeholder="https://github.com/"></label><label>Logo URL<input name="logo_url" type="url" placeholder="https://"></label><button class="btn btn-primary" type="submit">Create draft listing</button><div id="formStatus" class="status"></div></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/sell-project.js"></script></body></html>
