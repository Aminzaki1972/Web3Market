</head><body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script><script>
const SB_URL='https://hzhqlexnhtukfljcvnyd.supabase.co',SB_KEY='sb_publishable_lO7uEsiM0T8oeHB75DMxkA_287VZ9eI',db=supabase.createClient(SB_URL,SB_KEY);
async function submitReview(){
 const {data:{session}}=await db.auth.getSession();
 if(!session){alert('Please sign in to the seller account first.');return;}
 const id=localStorage.getItem('web3market_project_id');
 if(!id){alert('Please save the project as a Draft first.');return;}
 const {data:project,error:loadError}=await db.from('projects').select('*').eq('id',id).eq('owner_id',session.user.id).single();
 if(loadError||!project){alert('Project draft could not be found.');return;}
 const required=[['title','Project Name'],['short_description','Short Description'],['website_url','Project Website'],['price','Asking Price'],['transfer_terms','Transfer Terms']];
 const missing=required.filter(([k])=>project[k]===null||project[k]===undefined||project[k]==='').map(([,label])=>label);
 if(!project.verification?.declaration)missing.push('Ownership Declaration');
 if(missing.length){alert('Please complete these required items before submitting:\n\n• '+missing.join('\n• '));return;}
 const {error:updateError}=await db.from('projects').update({status:'ai_review',project_status:'ai_review',ai_status:'pending'}).eq('id',id).eq('owner_id',session.user.id);
 if(updateError){alert('Submission failed: '+updateError.message);return;}
 try{
   const res=await fetch(`${SB_URL}/functions/v1/ai-review-project`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SB_KEY},body:JSON.stringify({project_id:id})});
   const result=await res.json();
   if(!res.ok)throw new Error(result.error||'AI Review failed');
   const score=result?.result?.ai_score??'—', status=result?.result?.ai_status||'unknown';
   alert(`AI Review completed successfully.\n\nScore: ${score}/100\nStatus: ${status}`);
   location.reload();
 }catch(e){
   await db.from('projects').update({status:'ai_review',project_status:'ai_review',ai_status:'pending'}).eq('id',id).eq('owner_id',session.user.id);
   alert('Project was submitted, but the AI review could not be completed yet. It remains queued for AI Review.');
 }
}
</script><h1>Seller Project Wizard</h1><button onclick="submitReview()">Submit for Review</button>
