<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deal Room | Web3Market</title><link rel="stylesheet" href="css/style.css"><style>body{background:#f7f9fc;color:#111827}.room{max-width:1050px;margin:30px auto;padding:0 16px}.head,.card{background:#fff;border:1px solid #e6eaf0;border-radius:16px}.head{padding:20px;margin-bottom:16px}.head h1{margin:0;font-size:25px}.meta{color:#64748b;font-size:12px;margin-top:7px}.status{display:inline-block;margin-top:12px;padding:6px 10px;border-radius:99px;background:#f1f5f9;font-size:11px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 320px;gap:16px}.card{padding:18px}.chat{height:520px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:8px 2px}.msg{max-width:78%;padding:10px 12px;border-radius:13px;background:#f1f5f9;margin:8px 0;font-size:13px}.msg.mine{margin-left:auto;background:#ede9fe}.msg small{display:block;color:#64748b;font-size:9px;margin-top:4px}.composer{display:flex;gap:8px;border-top:1px solid #eef1f5;padding-top:12px}.composer input{flex:1;padding:12px;border:1px solid #dbe1ea;border-radius:10px}.btn{padding:11px 14px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#7c3aed;color:#fff}.info{font-size:12px;color:#64748b;line-height:1.6}.notice{padding:11px;border-radius:10px;background:#eff6ff;color:#1e40af;font-size:11px;font-weight:700}.actions{display:grid;gap:8px;margin-top:14px}.actions .btn{width:100%}@media(max-width:800px){.grid{grid-template-columns:1fr}.chat{height:460px}}</style></head><body><header class="topbar"><a class="brand" href="marketplace.html"><span class="brand-mark">W3</span><span>Web3Market</span></a><nav><a href="marketplace.html">Marketplace</a><a href="seller-dashboard.html">Seller Dashboard</a><a href="buyer-dashboard.html">Buyer Dashboard</a></nav></header><main class="room"><section class="head"><h1>Deal Room</h1><div id="dealMeta" clas
