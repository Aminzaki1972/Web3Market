<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Professional Web3Market buyer dashboard"><title>Buyer Dashboard | Web3Market</title><link rel="stylesheet" href="css/marketplace.css"><style>
:root{--bg:#f7f9fc;--card:#fff;--line:#e6eaf0;--text:#111827;--muted:#64748b;--purple:#7c3aed;--blue:#38bdf8;--green:#16a34a}body{background:var(--bg);color:var(--text)}.buyer-layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 72px)}.buyer-side{background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:72px;height:calc(100vh - 72px);box-sizing:border-box}.side-label{font-size:10px;letter-spacing:1.5px;color:#94a3b8;font-weight:900;padding:0 11px 10px;text-transform:uppercase}.side-nav{display:grid;gap:5px}.side-nav a{display:flex;align-items:center;gap:10px;padding:12px;border-radius:11px;text-decoration:none;color:#475569;font-size:13px;font-weight:800}.side-nav a:hover,.side-nav a.active{background:#f3eefe;color:var(--purple)}.side-icon{width:20px;text-align:center}.wallet-box{position:absolute;bottom:18px;left:14px;right:14px;border:1px solid var(--line);background:#fafbff;border-radius:13px;padding:12px;font-size:11px}.wallet-box strong{display:block;font-size:12px;margin-bottom:4px}.buyer-main{padding:32px;max-width:1280px;width:100%;box-sizing:border-box}.dash-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.dash-top h1{margin:0;font-size:31px;letter-spacing:-.5px}.dash-top p{margin:6px 0 0;color:var(--muted);font-size:14px}.dash-actions{display:flex;gap:9px}.dash-btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 15px;border-radius:10px;text-decoration:none;font-weight:800;font-size:12px;border:1px solid var(--line);background:#fff;color:#334155}.dash-btn.primary{background:linear-gradient(135deg,var(--purple),#6366f1);color:#fff;border-color:transparent}.buyer-banner{display:flex;align-items:center;gap:10px;background:linear-gradient(100deg,#f5f3ff,#effaff);border:1px solid #e7defd;border-radius:15px;padding:13px 16px;margin-bottom:18px;color:#4c1d95;font-size:12px;font-weight:800}.profile-card{display:flex;align-items:center;gap:15px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px 19px;margin-bottom:18px}.avatar{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,var(--purple),var(--blue));display:grid;place-items:center;color:#fff;font-size:20px;font-weight:900}.profile{flex:1}.profile h2{margin:0 0 4px;font-size:17px}.profile p{margin:0;color:var(--muted);font-size:12px}.verified{display:inline-flex;background:#ecfdf3;color:var(--green);border-radius:99px;padding:4px 8px;font-size:10px;margin-left:6px;vertical-align:middle}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px}.stat{padding:18px}.stat .label{font-size:11px;color:var(--muted);font-weight:800}.stat .value{font-size:25px;font-weight:900;margin-top:8px}.stat .sub{font-size:10px;color:var(--green);margin-top:4px;font-weight:700}.buyer-grid{display:grid;grid-template-columns:1.45fr .85fr;gap:17px}.panel{padding:19px;margin-bottom:17px}.panel h2{font-size:15px;margin:0 0 13px}.listing{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-top:1px solid #eef1f5}.listing:first-of-type{border-top:0}.listing h3{font-size:13px;margin:0 0 4px}.listing h3 a{text-decoration:none;color:var(--text)}.listing h3 a:hover{color:var(--purple)}.muted{color:var(--muted);font-size:11px}.status-pill{display:inline-block;height:max-content;padding:5px 8px;border-radius:99px;background:#f1f5f9;color:#475569;font-size:10px;font-weight:800;white-space:nowrap}.empty{padding:18px;border:1px dashed var(--line);border-radius:11px;color:var(--muted);font-size:12px}.profile-row{display:flex;gap:13px;align-items:center}.score{font-size:28px;font-weight:900}.progress{height:7px;background:#eef1f6;border-radius:99px;overflow:hidden;margin:9px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--blue));border-radius:99px}.quick-links{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick-links a{padding:11px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:#334155;font-size:11px;font-weight:800}.quick-links a:hover{border-color:#d8ccf8;background:#faf8ff;color:var(--purple)}.status{color:var(--muted);padding:15px}.topbar{background:rgba(255,255,255,.95)!important;border-color:var(--line)!important}.topbar .brand{color:var(--text)}.topbar nav a{color:var(--muted)}.topbar nav a.active,.topbar nav a:hover{color:var(--purple)}
@media(max-width:900px){.buyer-layout{grid-template-columns:1fr}.buyer-side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:9px}.side-label,.wallet-box{display:none}.side-nav{display:flex;overflow:auto}.side-nav a{white-space:nowrap}.stats{grid-template-columns:1fr 1fr}.buyer-grid{grid-template-columns:1fr}.buyer-main{padding:22px 16px}}@media(max-width:560px){.dash-top{display:block}.dash-actions{margin-top:14px}.stats{grid-template-columns:1fr 1fr}.profile-card .dash-btn{display:none}.buyer-main{padding:18px 13px}.quick-links{grid-template-columns:1fr}}
