<style>
body{margin:0;background:#f7f9fc;color:#111827;font-family:Inter,system-ui,sans-serif}.buyer{min-height:100vh}.buyer-top{height:72px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-sizing:border-box}.brand{font-weight:900;font-size:20px;color:#111827;text-decoration:none}.brand-mark{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:8px;border-radius:9px;background:#7c3aed;color:#fff;font-size:12px}.buyer-nav{display:flex;gap:18px}.buyer-nav a{color:#64748b;text-decoration:none;font-size:13px;font-weight:800}.buyer-nav a:hover{color:#7c3aed}.wrap{max-width:1180px;margin:0 auto;padding:34px 18px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.5px;color:#7c3aed;text-transform:uppercase}.hero h1{margin:7px 0 5px;font-size:32px}.hero p{margin:0;color:#64748b;font-size:14px}.actions{display:flex;gap:9px}.btn{padding:11px 15px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;color:#334155;text-decoration:none;font-size:12px;font-weight:800}.btn.primary{background:#7c3aed;color:#fff;border-color:#7c3aed}.identity{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;display:flex;align-items:center;gap:14px;margin-bottom:18px}.avatar{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#38bdf8);display:grid;place-items:center;color:#fff;font-weight:900;font-size:19px}.identity-main{flex:1}.identity h2{margin:0 0 4px;font-size:17px}.identity p{margin:0;color:#64748b;font-size:12px}.role{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:99px;background:#f3e8ff;color:#6d28d9;font-size:10px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:18px}.label{font-size:10px;color:#64748b;font-weight:900}.value{font-size:25px;font-weight:900;margin-top:8px}.sub{font-size:10px;color:#16a34a;margin-top:4px}.content{display:grid;grid-template-columns:1.5fr .8fr;gap:16px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:19px;margin-bottom:16px}.panel h2{font-size:15px;margin:0 0 13px}.item{padding:13px 0;border-top:1px solid #eef1f5;display:flex;justify-content:space-between;gap:12px}.item:first-of-type{border-top:0}.item strong{font-size:13px}.muted{color:#64748b;font-size:11px}.pill{padding:5px 8px;border-radius:99px;background:#f1f5f9;font-size:10px;font-weight:800;height:max-content}.empty{padding:18px;border:1px dashed #dbe1e8;border-radius:11px;color:#64748b;font-size:12px}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}.links a{padding:11px;border:1px solid #e5e7eb;border-radius:10px;text-decoration:none;color:#334155;font-size:11px;font-weight:800}.notice{padding:13px 15px;border-radius:12px;background:#f5f3ff;border:1px solid #e9d5ff;color:#5b21b6;font-size:12px;font-weight:800;margin-bottom:18px}@media(max-width:800px){.buyer-nav{display:none}.hero{display:block}.actions{margin-top:14px}.grid{grid-template-columns:1fr 1fr}.content{grid-template-columns:1fr}}@media(max-width:520px){.buyer-top{padding:0 14px}.wrap{padding:22px 13px}.hero h1{font-size:26px}.grid{grid-template-columns:1fr 1fr}.identity .btn{display:none}.links{grid-template-columns:1fr}}
