==='verified');return verified[0]||null}async function challengeAndVerify(c,factor){let code=prompt('Enter the 6-digit code from your authenticator app:');if(code===null)throw new Error('Two-factor authentication was cancelled.');code=code.trim();if(!/^\\d{6}$/.test(code))throw new Error('Enter the 6-digit authenticator code.');const {data:ch,error:ce}=await c.auth.mfa.challenge({factorId:factor.id});if(ce)throw ce;const {error:ve}=await c.auth.mfa.verify({factorId:factor.id,challengeId:ch.id,code});if(ve)throw ve}f.addEventListener('submit',async e=>{e.preventDefault();const email=em.value.trim().toLowerCase(),password=pw.value;if(!email||!password)return show('Enter your administrator email and password.',false);btn.disabled=true;btn.textContent='Verifying…';try{const c=await client();const {data,error}=await c.auth.signInWithPassword({email,password});if(error)throw error;if(!data?.user)throw new Error('Authentication did not return a user.');if(!data.user.email_confirmed_at){await c.auth.signOut();throw new Error('Please confirm the administrator email before signing in')}await verifyAdmin(c,data.user);const factor=await requireTotp(c);if(!factor){show('Administrator verified. Two-factor authentication is not enrolled yet. Opening secure setup…',true);location.replace('admin-mfa-v2.html?v=20260926');return}show('Administrator verified. Enter your authenticator code…',true);btn.textContent='Waiting for 2FA…';await challengeAndVerify(c,factor);show('Two-factor authentication verified. Opening Admin Review Center…',true);location.replace('admin-review.html')}catch(e){console.error('Web3Market admin login:',e);show(e?.message||'Administrator sign in failed.',false)}finally{btn.disabled=false;btn.textContent='Sign in as Administrator'}})})();</script></body></html>
