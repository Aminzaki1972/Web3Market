name: Deal Management Sandbox Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "prototype/deal-management/**"
      - "deal-management-preview.html"
      - "js/deal-room.js"
      - "js/deal-checkout.js"
      - "js/project.js"
      - "js/offer-form-fix.js"
      - "deal-checkout.html"
      - "deal-room.html"
      - ".github/workflows/deal-management-sandbox-tests.yml"
  push:
    branches:
      - prototype/deal-management-system-20261114
    paths:
      - "prototype/deal-management/**"
      - "deal-management-preview.html"
      - "js/deal-room.js"
      - "js/deal-checkout.js"
      - "js/project.js"
      - "js/offer-form-fix.js"
      - "deal-checkout.html"
      - "deal-room.html"
      - ".github/workflows/deal-management-sandbox-tests.yml"

permissions:
  contents: read

jobs:
  domain-tests:
    name: Deno domain and workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sandbox branch
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Deal Room and checkout client syntax
        run: |
          node --check js/deal-room.js
          node --check js/deal-checkout.js
          node --check js/project.js
          node --check js/offer-form-fix.js
          node --check prototype/deal-management/agreement-snapshot-browser.js

      - name: Assert legacy Deal Room financial paths stay disabled
        shell: bash
        run: |
          ! grep -Fq "execute-safe-release" deal-room.html
          ! grep -Fq "release-signing-fix.js" deal-room.html
          ! grep -Fq "prepare-safe-release-tx" deal-room.html
          ! grep -Fq "/functions/v1/verify-deal-payment" js/deal-room.js
          ! grep -Fq ".from('deal_messages').insert" js/deal-room.js
          ! grep -Fq "functions.invoke('create-safe'" js/deal-room.js
          ! grep -Fq "functions/v1/create-safe" js/deal-checkout.js
          ! grep -Fq "functions/v1/verify-deal-payment" js/deal-checkout.js
          ! grep -Fq "eth_sendTransaction" js/deal-checkout.js
          ! grep -Fq "eth_requestAccounts" js/deal-checkout.js
          ! grep -Fq "from('deals').insert" js/project.js
          ! grep -Fq "from('deal_messages').insert" js/project.js
          ! grep -Fq "from('deals').insert" js/offer-form-fix.js
          ! grep -Fq "from('deal_messages').insert" js/offer-form-fix.js
          grep -Fq "approvalHashes[k]===currentFingerprint" deal-management-preview.html
          grep -Fq "approvalHashes[k]===agreementHashState.termsHash" deal-management-preview.html

      - name: Run sandbox tests
        run: deno test --allow-read=deal-management-preview.html prototype/deal-management/
