name: W3M Slither + Aderyn Contract Analysis
run-name: W3M Static Analysis ${{ inputs.audit_id }}

on:
  push:
    branches:
      - "feature/slither-aderyn-audit-layer"
  pull_request:
    paths:
      - ".github/workflows/w3m-contract-analysis.yml"
      - "scripts/w3m-contract-analysis/**"
      - "tests/w3m-contract-analysis/**"
      - "supabase/functions/w3m-code-audit/**"
  workflow_dispatch:
    inputs:
      repository_url:
        description: "Public GitHub repository URL to analyze"
        required: true
        type: string
        default: "https://github.com/Aminzaki1972/Web3Market"
      commit_sha:
        description: "Exact 40-character commit SHA to analyze"
        required: true
        type: string
      audit_id:
        description: "W3M audit UUID for result correlation"
        required: true
        type: string

permissions: {}

concurrency:
  group: w3m-contract-analysis-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  static-analysis:
    name: Isolated Solidity static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Validate target and resolve immutable commit
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_URL: ${{ inputs.repository_url }}
          INPUT_SHA: ${{ inputs.commit_sha }}
          INPUT_AUDIT_ID: ${{ inputs.audit_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, urllib.parse, subprocess
          event = os.environ["EVENT_NAME"]
          if event in ("push", "pull_request"):
              owner, name = os.environ["EVENT_REPOSITORY"].split("/", 1)
              url = f"https://github.com/{owner}/{name}"
              sha = os.environ["PR_HEAD_SHA"] if event == "pull_request" else os.environ["EVENT_SHA"]
              audit_id = ""
          else:
              url = os.environ["INPUT_URL"].strip()
              sha = os.environ.get("INPUT_SHA", "").strip()
              audit_id = os.environ.get("INPUT_AUDIT_ID", "").strip()
              if not re.fullmatch(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}", audit_id):
                  raise SystemExit("audit_id must be a valid UUID.")
          parsed = urllib.parse.urlparse(url)
          parts = [p for p in parsed.path.split("/") if p]
          if parsed.scheme != "https" or parsed.hostname != "github.com" or parsed.username or parsed.password or len(parts) != 2:
              raise SystemExit("Only https://github.com/OWNER/REPO public repository URLs are accepted.")
          owner, repo = parts
          repo = repo.removesuffix(".git")
          if not re.fullmatch(r"[A-Za-z0-9_.-]{1,100}", owner) or not re.fullmatch(r"[A-Za-z0-9_.-]{1,100}", repo):
              raise SystemExit("Invalid GitHub owner or repository name.")
          if sha and not re.fullmatch(r"[0-9a-fA-F]{40}", sha):
              raise SystemExit("commit_sha must be a full 40-character Git commit SHA.")
          if not sha:
              refs = subprocess.check_output(["git", "ls-remote", f"https://github.com/{owner}/{repo}.git", "HEAD"], text=True).strip().split()
              sha = refs[0] if refs else ""
          if not re.fullmatch(r"[0-9a-fA-F]{40}", sha):
              raise SystemExit("Could not resolve a valid immutable commit SHA.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"url=https://github.com/{owner}/{repo}.git\n")
              f.write(f"owner={owner}\nrepo={repo}\n")
              f.write(f"requested_sha={sha}\n")
              f.write(f"sha={sha}\n")
              f.write(f"audit_id={audit_id}\n")
          print(f"Target: {owner}/{repo} @ {sha}")
          PY

      - name: Fetch public source at pinned commit (no credentials)
        id: source
        shell: bash
        env:
          REPOSITORY_URL: ${{ steps.target.outputs.url }}
          COMMIT_SHA: ${{ steps.target.outputs.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p target
          git -C target init
          git -C target remote add origin "$REPOSITORY_URL"
          git -C target fetch --depth=1 --no-tags origin "$COMMIT_SHA"
          git -C target checkout --detach FETCH_HEAD
          test "$(git -C target rev-parse HEAD)" = "$COMMIT_SHA"
          COUNT="$(find target -type f -not -path 'target/.git/*' | wc -l)"
          SOL_COUNT="$(find target -type f -name '*.sol' -not -path 'target/.git/*' | wc -l)"
          echo "Repository files: $COUNT; Solidity files: $SOL_COUNT"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "has_solidity=false" >> "$GITHUB_OUTPUT"
            echo "Push/PR runs execute fixture smoke tests only; customer-target scans are manual-dispatch only."
            exit 0
          fi
          if [ "$COUNT" -gt 5000 ] || [ "$SOL_COUNT" -gt 1000 ]; then
            echo "Repository exceeds the W3M static-analysis safety limits."
            exit 1
          fi
          if [ "$SOL_COUNT" -eq 0 ]; then
            echo "has_solidity=false" >> "$GITHUB_OUTPUT"
            echo "No Solidity files in this repository snapshot; scanner execution is skipped."
            exit 0
          fi
          echo "has_solidity=true" >> "$GITHUB_OUTPUT"

      - name: Fetch trusted W3M normalizer source at workflow commit
        shell: bash
        env:
          TOOLS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init w3m-tools
          git -C w3m-tools remote add origin "https://github.com/${{ github.repository }}.git"
          git -C w3m-tools fetch --depth=1 --no-tags origin "$TOOLS_SHA"
          git -C w3m-tools checkout --detach FETCH_HEAD
          test "$(git -C w3m-tools rev-parse HEAD)" = "$TOOLS_SHA"

      - name: Install Foundry (forge) required by Foundry-based repositories
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: stable
          cache: false

      - name: Verify Foundry installation
        shell: bash
        run: |
          set -euo pipefail
          command -v forge
          forge --version
          cast --version
          anvil --version

      - name: Build Foundry target before Slither analysis
        if: steps.source.outputs.has_solidity == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/target/foundry.toml" ]; then
            echo "Foundry project detected; building pinned target to generate out/build-info."
            forge build --root "$GITHUB_WORKSPACE/target" --skip test
          else
            echo "No foundry.toml found; skipping Foundry build."
          fi

      - name: Install pinned Slither
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user "slither-analyzer==0.11.6"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/slither" --version
          SOLC_VERSION="0.8.20"
          if [ -f "$GITHUB_WORKSPACE/target/foundry.toml" ]; then
            SOLC_VERSION="$(python3 - "$GITHUB_WORKSPACE/target/foundry.toml" <<'PY'
          import re, sys, tomllib
          with open(sys.argv[1], "rb") as handle:
              config = tomllib.load(handle)
          version = config.get("profile", {}).get("default", {}).get("solc_version") or config.get("solc_version") or "0.8.20"
          if not re.fullmatch(r"\\d+\\.\\d+\\.\\d+", str(version)):
              raise SystemExit(f"Unsupported solc_version in foundry.toml: {version!r}")
          print(version)
          PY
          )"
          fi
          echo "Using solc version: $SOLC_VERSION"
          solc-select install "$SOLC_VERSION"
          solc-select use "$SOLC_VERSION"
          solc --version

      - name: Install pinned Aderyn with installer checksum verification
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL             "https://github.com/Cyfrin/aderyn/releases/download/aderyn-v0.6.8/aderyn-installer.sh"             -o /tmp/aderyn-installer.sh
          echo "6c005c222681f1349caa31aa7c9d55b0fd0ae779c0faad65e8eaa6dc872f8faf  /tmp/aderyn-installer.sh" | sha256sum -c -
          sh /tmp/aderyn-installer.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/aderyn" --version

      - name: Smoke-test Slither on the intentionally vulnerable fixture
        shell: bash
        run: |
          set +e
          cd w3m-tools/tests/w3m-contract-analysis/fixtures
          slither src/VulnerableVaultFixture.sol --json "$GITHUB_WORKSPACE/smoke-slither.json" > "$GITHUB_WORKSPACE/smoke-slither.stdout.log" 2> "$GITHUB_WORKSPACE/smoke-slither.stderr.log"
          CODE=$?
          echo "Slither fixture process exit: $CODE"
          if [ ! -s "$GITHUB_WORKSPACE/smoke-slither.json" ]; then cat "$GITHUB_WORKSPACE/smoke-slither.stderr.log"; exit 1; fi
          python3 -m json.tool "$GITHUB_WORKSPACE/smoke-slither.json" > /dev/null

      - name: Smoke-test Aderyn on the intentionally vulnerable fixture
        shell: bash
        run: |
          set +e
          cd w3m-tools/tests/w3m-contract-analysis/fixtures
          aderyn . --output "$GITHUB_WORKSPACE/smoke-aderyn.json" > "$GITHUB_WORKSPACE/smoke-aderyn.stdout.log" 2> "$GITHUB_WORKSPACE/smoke-aderyn.stderr.log"
          CODE=$?
          echo "Aderyn fixture process exit: $CODE"
          if [ ! -s "$GITHUB_WORKSPACE/smoke-aderyn.json" ]; then cat "$GITHUB_WORKSPACE/smoke-aderyn.stderr.log"; exit 1; fi
          python3 -m json.tool "$GITHUB_WORKSPACE/smoke-aderyn.json" > /dev/null

      - name: Upload isolated engine smoke-test reports
        uses: actions/upload-artifact@v4
        with:
          name: w3m-static-analysis-smoke-tests-${{ github.run_id }}
          path: |
            smoke-slither.json
            smoke-slither.stdout.log
            smoke-slither.stderr.log
            smoke-aderyn.json
            smoke-aderyn.stdout.log
            smoke-aderyn.stderr.log
          if-no-files-found: error
          retention-days: 14
      - name: Run Slither across every Solidity source file
        if: steps.source.outputs.has_solidity == 'true'
        id: slither
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' SOL_FILES < <(find "$GITHUB_WORKSPACE/target" -type f -name '*.sol' -not -path '*/.git/*' -print0 | sort -z)
          if [ "${#SOL_FILES[@]}" -eq 0 ]; then
            echo "No Solidity source files were found after checkout."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/slither-individual"
          MAX_EXIT=0
          ANALYZED_CONTRACTS=0
          COMPILE_ERRORS=0
          for INDEX in "${!SOL_FILES[@]}"; do
            FILE="${SOL_FILES[$INDEX]}"
            REPORT="$GITHUB_WORKSPACE/slither-individual/report-$INDEX.json"
            set +e
            slither "$FILE" --json "$REPORT" > "$GITHUB_WORKSPACE/slither-individual/stdout-$INDEX.log" 2> "$GITHUB_WORKSPACE/slither-individual/stderr-$INDEX.log"
            CODE=$?
            set -e
            if [ "$CODE" -gt "$MAX_EXIT" ]; then MAX_EXIT="$CODE"; fi
            if [ ! -s "$REPORT" ]; then
              echo "Slither produced no JSON report for: $FILE"
              cat "$GITHUB_WORKSPACE/slither-individual/stderr-$INDEX.log"
              exit 1
            fi
            python3 -m json.tool "$REPORT" > /dev/null
            if grep -q "No contract was analyzed" "$GITHUB_WORKSPACE/slither-individual/stdout-$INDEX.log" "$GITHUB_WORKSPACE/slither-individual/stderr-$INDEX.log"; then
              echo "No contracts compiled from: ${FILE#"$GITHUB_WORKSPACE/target/"}"
              continue
            fi
            CONTRACTS="$(python3 - "$GITHUB_WORKSPACE/slither-individual/stdout-$INDEX.log" "$GITHUB_WORKSPACE/slither-individual/stderr-$INDEX.log" <<'PY'
          import re, sys
          text = "\n".join(open(path, encoding="utf-8", errors="replace").read() for path in sys.argv[1:])
          matches = re.findall(r"analyzed \((\d+) contracts?", text)
          print(max((int(x) for x in matches), default=0))
          PY
          )"
            ANALYZED_CONTRACTS=$((ANALYZED_CONTRACTS + CONTRACTS))
            if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 255 ]; then
              COMPILE_ERRORS=$((COMPILE_ERRORS + 1))
            fi
          done
          if [ "$ANALYZED_CONTRACTS" -eq 0 ]; then
            echo "Slither analyzed zero contracts. Refusing to publish an empty/false-clean report."
            exit 1
          fi
          if [ "$COMPILE_ERRORS" -gt 0 ]; then
            echo "Slither reported compilation/tool errors for $COMPILE_ERRORS Solidity file(s)."
            exit 1
          fi
          python3 - "$GITHUB_WORKSPACE/slither-individual" "$GITHUB_WORKSPACE/slither.json" <<'PY'
          import glob, json, os, sys
          folder, output = sys.argv[1:]
          detectors = []
          for path in sorted(glob.glob(os.path.join(folder, "report-*.json"))):
              with open(path, encoding="utf-8") as handle:
                  report = json.load(handle)
              results = report.get("results") if isinstance(report, dict) else {}
              rows = results.get("detectors", []) if isinstance(results, dict) else []
              if isinstance(rows, list):
                  detectors.extend(rows)
          with open(output, "w", encoding="utf-8") as handle:
              json.dump({"success": True, "error": None, "results": {"detectors": detectors}}, handle)
          PY
          echo "exit_code=$MAX_EXIT" >> "$GITHUB_OUTPUT"
          echo "Slither analyzed $ANALYZED_CONTRACTS contract(s) across ${#SOL_FILES[@]} Solidity file(s); findings: $(python3 -c 'import json; print(len(json.load(open("slither.json"))["results"]["detectors"]))')"

      - name: Run Aderyn (finding exit codes are not tool failures)
        if: steps.source.outputs.has_solidity == 'true'
        id: aderyn
        shell: bash
        run: |
          set +e
          cd target
          aderyn . --output ../aderyn.json > ../aderyn.stdout.log 2> ../aderyn.stderr.log
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          if [ ! -s ../aderyn.json ]; then
            echo "Aderyn did not produce its expected JSON report."
            exit 1
          fi
          python3 -m json.tool ../aderyn.json > /dev/null
          exit 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - name: Run dispatcher validation tests
        run: deno test w3m-tools/supabase/functions/w3m-code-audit/github-static-analysis.test.ts

      - name: Type-check integrated audit worker
        run: deno check w3m-tools/supabase/functions/w3m-code-audit/index.ts

      - name: Run normalizer unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s w3m-tools/tests/w3m-contract-analysis -p 'test_*.py' -v

      - name: Normalize independent engine outputs
        if: steps.source.outputs.has_solidity == 'true'
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ steps.target.outputs.owner }}/${{ steps.target.outputs.repo }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          AUDIT_ID: ${{ steps.target.outputs.audit_id }}
          SLITHER_EXIT: ${{ steps.slither.outputs.exit_code }}
          ADERYN_EXIT: ${{ steps.aderyn.outputs.exit_code }}
        run: |
          set -euo pipefail
          python3 w3m-tools/scripts/w3m-contract-analysis/normalize.py             --slither slither.json             --aderyn aderyn.json             --repository "$TARGET_REPOSITORY"             --commit "$TARGET_SHA"             --audit-id "$AUDIT_ID"             --slither-exit "$SLITHER_EXIT"             --aderyn-exit "$ADERYN_EXIT"             --output w3m-contract-analysis.json
          python3 -m json.tool w3m-contract-analysis.json > /dev/null

      - name: Upload raw and normalized reports
        if: steps.source.outputs.has_solidity == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: w3m-contract-analysis-${{ steps.target.outputs.repo }}-${{ steps.target.outputs.sha }}
          path: |
            slither.json
            aderyn.json
            w3m-contract-analysis.json
            slither.stdout.log
            slither.stderr.log
            aderyn.stdout.log
            aderyn.stderr.log
          if-no-files-found: error
          retention-days: 14
