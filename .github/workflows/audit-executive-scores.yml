name: Audit executive score contract checks

on:
  pull_request:
    paths:
      - "supabase/functions/w3m-code-audit/index.ts"
      - "supabase/migrations/*audit_executive_scores.sql"
      - "supabase/migrations/*atomic_code_audit_rate_limit.sql"
      - "tests/atomic-code-audit-rate-limit.sh"
      - "js/code-audit.js"
      - "tests/audit-executive-scores-smoke.py"
      - ".github/workflows/audit-executive-scores.yml"
  push:
    branches:
      - "feat/audit-executive-scores"
    paths:
      - "supabase/functions/w3m-code-audit/index.ts"
      - "supabase/migrations/*audit_executive_scores.sql"
      - "js/code-audit.js"
      - "tests/audit-executive-scores-smoke.py"
      - ".github/workflows/audit-executive-scores.yml"

permissions:
  contents: read

jobs:
  contract-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run free local smoke tests
        run: python3 tests/audit-executive-scores-smoke.py
      - name: Verify executive score contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          engine = Path("supabase/functions/w3m-code-audit/index.ts").read_text()
          ui = Path("js/code-audit.js").read_text()
          migrations = list(Path("supabase/migrations").glob("*audit_executive_scores.sql"))
          if len(migrations) != 1:
              sys.exit(f"Expected exactly one executive-score migration; found {len(migrations)}")
          migration = migrations[0].read_text()

          checks = {
              "schema defines scalability": "scalability:{type:\"NUMBER\"" in engine,
              "schema defines ai_fit": "ai_fit:{type:\"NUMBER\"" in engine,
              "schema requires both executive scores": '"scalability","ai_fit"' in engine,
              "model instructions request both scores": "web3, scalability, and ai_fit values 0-100" in engine,
              "database mapping persists scalability": "scalability_score:sc.scalability" in engine,
              "database mapping persists AI Fit": "ai_fit_score:sc.ai_fit" in engine,
              "UI displays scalability": 'metric("Scalability (static estimate)",a.scalability_score)' in ui,
              "UI displays AI Fit": 'metric("AI Fit (evidence-based)",a.ai_fit_score)' in ui,
              "migration adds nullable integer columns": "ADD COLUMN IF NOT EXISTS scalability_score integer" in migration and "ADD COLUMN IF NOT EXISTS ai_fit_score integer" in migration,
              "migration bounds both scores": "scalability_score BETWEEN 0 AND 100" in migration and "ai_fit_score BETWEEN 0 AND 100" in migration,
              "migration preserves historical nulls": "scalability_score IS NULL OR" in migration and "ai_fit_score IS NULL OR" in migration,
              "constraint names are scoped to the target table": "conname = 'code_audits_scalability_score_range' AND conrelid = 'public.code_audits'::regclass" in migration and "conname = 'code_audits_ai_fit_score_range' AND conrelid = 'public.code_audits'::regclass" in migration,
              "migration contains no destructive table/column drops": not re.search(r"\bDROP\s+(?:TABLE|COLUMN)\b", migration, re.IGNORECASE),
              "UI discloses static-score limitations": "not a load or production performance test" in ui and "does not prove that an AI feature works" in ui,
          }
          failed = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(f'{"PASS" if passed else "FAIL"}: {name}')
          if failed:
              sys.exit(f"{len(failed)} contract check(s) failed")
          print(f"All {len(checks)} executive-score contract checks passed.")
          PY

  postgres-migration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: w3m_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d w3m_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: w3m_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create disposable stand-in for existing audit table
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE TABLE public.code_audits (id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, summary text);"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.code_audits (summary) VALUES ('historical audit');"
          psql -v ON_ERROR_STOP=1 -c "CREATE TABLE public.code_audit_rate_limits (id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, fingerprint text NOT NULL, window_started_at timestamptz NOT NULL, request_count integer NOT NULL DEFAULT 0, created_at timestamptz NOT NULL DEFAULT now(), UNIQUE (fingerprint, window_started_at));"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"
      - name: Apply migration twice to verify safety and idempotency
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023000100_add_audit_executive_scores.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023000100_add_audit_executive_scores.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261102090000_atomic_code_audit_rate_limit.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261102090000_atomic_code_audit_rate_limit.sql
      - name: Verify atomic audit quota, concurrent cap, refunds, and RPC permissions
        run: bash tests/atomic-code-audit-rate-limit.sh
      - name: Verify historical NULLs, valid bounds, and rejected invalid scores
        run: |
          test "$(psql -At -c "SELECT count(*) FROM public.code_audits WHERE summary='historical audit' AND scalability_score IS NULL AND ai_fit_score IS NULL")" = "1"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.code_audits (summary, scalability_score, ai_fit_score) VALUES ('boundary scores', 0, 100);"
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.code_audits (summary, scalability_score) VALUES ('invalid low', -1);"; then
            echo "FAIL: negative scalability score was accepted"
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.code_audits (summary, ai_fit_score) VALUES ('invalid high', 101);"; then
            echo "FAIL: AI-Fit score above 100 was accepted"
            exit 1
          fi
          test "$(psql -At -c "SELECT count(*) FROM public.code_audits WHERE summary='boundary scores' AND scalability_score=0 AND ai_fit_score=100")" = "1"
          echo "PASS: migration executes on PostgreSQL, is idempotent, preserves historical NULLs, accepts boundaries, and rejects out-of-range scores."
