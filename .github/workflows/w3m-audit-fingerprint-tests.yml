name: W3M Audit Fingerprint Tests

on:
  pull_request:
    paths:
      - "supabase/functions/w3m-acquisition-verification/audit-fingerprint.ts"
      - "supabase/functions/w3m-acquisition-verification/audit-fingerprint.test.ts"
      - "supabase/functions/w3m-acquisition-verification/audit-manifest.ts"
      - "supabase/functions/w3m-acquisition-verification/audit-manifest.test.ts"
      - "supabase/functions/w3m-acquisition-verification/agreement-signature.ts"
      - "supabase/functions/w3m-acquisition-verification/agreement-signature.test.ts"
      - "supabase/functions/w3m-acquisition-verification/acquisition-terms.ts"
      - "supabase/functions/w3m-acquisition-verification/acquisition-terms.test.ts"
      - "supabase/functions/w3m-acquisition-verification/deal-audit-binding.ts"
      - "supabase/functions/w3m-acquisition-verification/deal-audit-binding.test.ts"
      - "supabase/functions/w3m-acquisition-verification/agreement-challenge.ts"
      - "supabase/functions/w3m-acquisition-verification/agreement-challenge.test.ts"
      - "supabase/functions/w3m-acquisition-verification/acceptance-ledger.ts"
      - "supabase/functions/w3m-acquisition-verification/acceptance-ledger.test.ts"
      - ".github/workflows/w3m-audit-fingerprint-tests.yml"
  push:
    branches:
      - "feat/w3m-audit-fingerprint-binding-20261107"
    paths:
      - "supabase/functions/w3m-acquisition-verification/audit-fingerprint.ts"
      - "supabase/functions/w3m-acquisition-verification/audit-fingerprint.test.ts"
      - "supabase/functions/w3m-acquisition-verification/audit-manifest.ts"
      - "supabase/functions/w3m-acquisition-verification/audit-manifest.test.ts"
      - "supabase/functions/w3m-acquisition-verification/agreement-signature.ts"
      - "supabase/functions/w3m-acquisition-verification/agreement-signature.test.ts"
      - "supabase/functions/w3m-acquisition-verification/acquisition-terms.ts"
      - "supabase/functions/w3m-acquisition-verification/acquisition-terms.test.ts"
      - "supabase/functions/w3m-acquisition-verification/deal-audit-binding.ts"
      - "supabase/functions/w3m-acquisition-verification/deal-audit-binding.test.ts"
      - "supabase/functions/w3m-acquisition-verification/agreement-challenge.ts"
      - "supabase/functions/w3m-acquisition-verification/agreement-challenge.test.ts"
      - "supabase/functions/w3m-acquisition-verification/acceptance-ledger.ts"
      - "supabase/functions/w3m-acquisition-verification/acceptance-ledger.test.ts"
      - ".github/workflows/w3m-audit-fingerprint-tests.yml"

permissions:
  contents: read

jobs:
  fingerprint-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run fingerprint and persisted-manifest tests
        run: deno test --allow-env=WS_NO_BUFFER_UTIL,WS_NO_UTF_8_VALIDATE supabase/functions/w3m-acquisition-verification/audit-fingerprint.test.ts supabase/functions/w3m-acquisition-verification/audit-manifest.test.ts supabase/functions/w3m-acquisition-verification/agreement-signature.test.ts supabase/functions/w3m-acquisition-verification/acquisition-terms.test.ts supabase/functions/w3m-acquisition-verification/deal-audit-binding.test.ts supabase/functions/w3m-acquisition-verification/agreement-challenge.test.ts supabase/functions/w3m-acquisition-verification/acceptance-ledger.test.ts
      - name: Type-check fingerprint and manifest modules
        run: deno check supabase/functions/w3m-acquisition-verification/audit-fingerprint.ts supabase/functions/w3m-acquisition-verification/audit-manifest.ts supabase/functions/w3m-acquisition-verification/agreement-signature.ts supabase/functions/w3m-acquisition-verification/acquisition-terms.ts supabase/functions/w3m-acquisition-verification/deal-audit-binding.ts supabase/functions/w3m-acquisition-verification/agreement-challenge.ts supabase/functions/w3m-acquisition-verification/acceptance-ledger.ts
