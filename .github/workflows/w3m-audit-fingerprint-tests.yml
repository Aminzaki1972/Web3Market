permissions:
  contents: read

jobs:
  fingerprint-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run fingerprint and persisted-manifest tests
        run: deno test --allow-env=WS_NO_BUFFER_UTIL,WS_NO_UTF_8_VALIDATE --allow-read=supabase/functions,js,supabase/migrations supabase/functions/w3m-acquisition-verification/audit-fingerprint.test.ts supabase/functions/w3m-acquisition-verification/audit-manifest.test.ts supabase/functions/w3m-acquisition-verification/agreement-signature.test.ts supabase/functions/w3m-acquisition-verification/acquisition-terms.test.ts supabase/functions/w3m-acquisition-verification/deal-audit-binding.test.ts supabase/functions/w3m-acquisition-verification/agreement-challenge.test.ts supabase/functions/w3m-acquisition-verification/acceptance-ledger.test.ts supabase/functions/w3m-acquisition-verification/terms-version-lifecycle.test.ts supabase/functions/w3m-acquisition-verification/finalization-acceptance.test.ts supabase/functions/w3m-acquisition-verification/handler.test.ts supabase/functions/w3m-acquisition-verification/deal-agreement-client.test.ts supabase/functions/_shared/w3m-v1-finalization-gate.test.ts supabase/functions/_shared/w3m-v1-safe-gate-source.test.ts js/wallet-manager.test.js js/w3m-deal-agreement-panel.test.js
      - name: Type-check fingerprint and manifest modules
        run: deno check supabase/functions/w3m-acquisition-verification/audit-fingerprint.ts supabase/functions/w3m-acquisition-verification/audit-manifest.ts supabase/functions/w3m-acquisition-verification/agreement-signature.ts supabase/functions/w3m-acquisition-verification/acquisition-terms.ts supabase/functions/w3m-acquisition-verification/deal-audit-binding.ts supabase/functions/w3m-acquisition-verification/agreement-challenge.ts supabase/functions/w3m-acquisition-verification/acceptance-ledger.ts supabase/functions/w3m-acquisition-verification/terms-version-lifecycle.ts supabase/functions/w3m-acquisition-verification/finalization-acceptance.ts supabase/functions/w3m-acquisition-verification/handler.ts supabase/functions/w3m-acquisition-verification/index.ts supabase/functions/_shared/w3m-v1-finalization-gate.ts supabase/functions/_shared/w3m-v1-finalization-gate-client-typecheck.ts
