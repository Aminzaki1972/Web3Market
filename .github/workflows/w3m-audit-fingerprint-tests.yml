name: W3M Audit Fingerprint Tests

on:
  pull_request:
    paths:
      - "supabase/functions/w3m-acquisition-verification/audit-fingerprint.ts"
      - "supabase/functions/w3m-acquisition-verification/audit-fingerprint.test.ts"
      - ".github/workflows/w3m-audit-fingerprint-tests.yml"
  push:
    branches:
      - "feat/w3m-audit-fingerprint-binding-20261107"
    paths:
      - "supabase/functions/w3m-acquisition-verification/audit-fingerprint.ts"
      - "supabase/functions/w3m-acquisition-verification/audit-fingerprint.test.ts"
      - ".github/workflows/w3m-audit-fingerprint-tests.yml"

permissions:
  contents: read

jobs:
  fingerprint-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run isolated fingerprint tests
        run: deno test supabase/functions/w3m-acquisition-verification/audit-fingerprint.test.ts
      - name: Type-check fingerprint module
        run: deno check supabase/functions/w3m-acquisition-verification/audit-fingerprint.ts
