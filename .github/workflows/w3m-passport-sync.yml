name: W3M Passport Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "passport/**"
      - "sitemap.xml"

# Prevent two Passport Sync runs from modifying main at the same time.
# GitHub Actions allows workflows to run concurrently by default.
concurrency:
  group: w3m-passport-sync-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Supabase through public DNS and test HTTPS
        env:
          SUPABASE_URL: https://hzhqlexnhtukfljcvnyd5.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_lO7uEsiM0T8oeHB75DMxkA_287VZ9eI
        run: |
          set -euo pipefail
          host="$(python3 -c 'import os, urllib.parse; print(urllib.parse.urlparse(os.environ["SUPABASE_URL"]).hostname)')"
          echo "System DNS test for: $host"
          if ! getent hosts "$host"; then
            echo "System DNS cannot resolve $host. Trying Cloudflare DNS-over-HTTPS..."
          fi
          ip="$(curl --fail --silent --show-error --max-time 20 \
            -H 'accept: application/dns-json' \
            "https://cloudflare-dns.com/dns-query?name=${host}&type=A" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["data"] for x in d.get("Answer",[]) if x.get("type")==1), ""))')"
          if [ -z "$ip" ]; then
            echo "Cloudflare DoH returned no A record; trying Google DNS-over-HTTPS..."
            ip="$(curl --fail --silent --show-error --max-time 20 \
              -H 'accept: application/dns-json' \
              "https://dns.google/resolve?name=${host}&type=A" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["data"] for x in d.get("Answer",[]) if x.get("type")==1), ""))')"
          fi
          test -n "$ip"
          echo "Resolved $host to $ip via public DNS."
          echo "$ip $host" | sudo tee -a /etc/hosts
          echo "Testing HTTPS endpoint..."
          curl --fail --silent --show-error --max-time 20 "$SUPABASE_URL/rest/v1/project_identities?select=identity_code&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY"
          echo
          echo "Supabase is reachable through the resolved IP."

      - name: Generate Passport pages and sitemap
        env:
          SUPABASE_URL: https://hzhqlexnhtukfljcvnyd5.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_lO7uEsiM0T8oeHB75DMxkA_287VZ9eI
        run: python3 scripts/sync_w3m_passports.py

      - name: Commit and push generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add passport sitemap.xml

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "chore: sync W3M Passport SEO pages"

          # Rebase onto the newest remote main immediately before pushing.
          # Retry because another workflow/manual push can land between
          # fetch/rebase and push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi

            echo "Push rejected on attempt $attempt; refreshing origin/main and retrying..."
            sleep $((attempt * 2))
          done

          echo "Failed to push after 5 attempts."
          exit 1
