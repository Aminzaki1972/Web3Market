name: W3M Passport Sync
# Triggers a fresh sync after Passport generator updates.
# Publication is strict: only verified identities are published.
# Newly verified identities are published as static SEO Passport pages.
# Deterministic generation is based only on currently verified identities.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "passport/**"
      - "sitemap.xml"
      - "passports.html"

concurrency:
  group: w3m-passport-sync-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Supabase connectivity
        env:
          SUPABASE_URL: https://hzhqlexnhtukfljcvnyd.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_lO7uEsiM0T8oeHB75DMxkA_287VZ9eI
        shell: bash
        run: |
          set +e
          echo "Checking Supabase REST endpoint (diagnostic only; sync has its own fallback)..."
          curl --fail --silent --show-error --retry 2 --retry-all-errors             --connect-timeout 8 --max-time 20             "$SUPABASE_URL/rest/v1/project_identities?select=identity_code&limit=1"             -H "apikey: $SUPABASE_PUBLISHABLE_KEY"             -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY"             >/tmp/supabase_connectivity_check.json
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "Supabase diagnostic check succeeded."
            cat /tmp/supabase_connectivity_check.json
          else
            echo "::warning::Direct Supabase DNS/HTTPS check failed (exit $rc). Continuing; sync_w3m_passports.py will use DNS-over-HTTPS fallback."
          fi
          exit 0

      - name: Generate Passport pages and sitemap
        env:
          SUPABASE_URL: https://hzhqlexnhtukfljcvnyd.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_lO7uEsiM0T8oeHB75DMxkA_287VZ9eI
        run: python3 scripts/sync_w3m_passports.py

      - name: Verify Passport publication integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          registry = json.loads(pathlib.Path("passport/registry.json").read_text(encoding="utf-8"))
          rows = registry.get("rows", [])
          sitemap = pathlib.Path("sitemap.xml").read_text(encoding="utf-8")
          errors = []
          for row in rows:
              ident = str(row.get("identity_code") or "").strip()
              if not ident:
                  errors.append("registry row without identity_code")
                  continue
              page = pathlib.Path("passport") / ident / "index.html"
              if not page.is_file():
                  errors.append(f"missing Passport page: {page}")
                  continue
              html = page.read_text(encoding="utf-8")
              if f"W3M Passport" not in html or ident not in html:
                  errors.append(f"invalid Passport page content: {page}")
              if f"<loc>https://web3market.xyz/passport/{ident}/</loc>" not in sitemap:
                  errors.append(f"missing sitemap entry: {ident}")
          if errors:
              print("Passport publication integrity check FAILED:")
              print("\\n".join(f"- {e}" for e in errors))
              raise SystemExit(1)
          print(f"Passport publication integrity check passed for {len(rows)} verified identities.")
          PY

      - name: Commit and push generated changes
        env:
          SUPABASE_URL: https://hzhqlexnhtukfljcvnyd.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_lO7uEsiM0T8oeHB75DMxkA_287VZ9eI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add passport sitemap.xml passports.html

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "chore: sync W3M Passport SEO pages"

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt/5"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            python3 scripts/sync_w3m_passports.py
            git add passport sitemap.xml passports.html

            if git diff --cached --quiet; then
              echo "Generated output is already up to date with origin/main."
              exit 0
            fi

            git commit -m "chore: sync W3M Passport SEO pages"

            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi

            echo "Push rejected on attempt $attempt; refreshing origin/main and rebuilding..."
            sleep $((attempt * 2))
          done

          echo "Failed to push after 5 attempts."
          exit 1
