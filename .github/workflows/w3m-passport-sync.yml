name: W3M Passport Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "passport/**"
      - "sitemap.xml"

# Prevent two Passport Sync runs from modifying main at the same time.
concurrency:
  group: w3m-passport-sync-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Supabase connectivity
        env:
          SUPABASE_URL: https://hzhqlexnhtukfljcvnyd5.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_lO7uEsiM0T8oeHB75DMxkA_287VZ9eI
        shell: bash
        run: |
          set +e
          echo "Checking Supabase REST endpoint (diagnostic only; sync has its own fallback)..."
          curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 8 --max-time 20 \
            "$SUPABASE_URL/rest/v1/project_identities?select=identity_code&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            >/tmp/supabase_connectivity_check.json
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "Supabase diagnostic check succeeded."
            cat /tmp/supabase_connectivity_check.json
          else
            echo "::warning::Direct Supabase DNS/HTTPS check failed (exit $rc). Continuing; sync_w3m_passports.py will use DNS-over-HTTPS fallback."
          fi
          exit 0
      - name: Generate Passport pages and sitemap
        env:
          SUPABASE_URL: https://hzhqlexnhtukfljcvnyd5.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_lO7uEsiM0T8oeHB75DMxkA_287VZ9eI
        run: python3 scripts/sync_w3m_passports.py

      - name: Commit and push generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add passport sitemap.xml

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "chore: sync W3M Passport SEO pages"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi

            echo "Push rejected on attempt $attempt; refreshing origin/main and retrying..."
            sleep $((attempt * 2))
          done

          echo "Failed to push after 5 attempts."
          exit 1
