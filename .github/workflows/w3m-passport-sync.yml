name: W3M Passport Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "passport/**"
      - "sitemap.xml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnostic
        run: |
          echo "W3M Passport Sync workflow started"
          python3 -c "print('runner OK')"
