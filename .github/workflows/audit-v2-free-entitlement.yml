name: W3M atomic free audit entitlement
on:
  pull_request:
    paths:
      - "supabase/functions/w3m-code-audit/index.ts"
      - "js/code-audit.js"
      - "code-audit.html"
      - "supabase/functions/verify-audit-payment/**"
      - "supabase/functions/guest-audit-access/**"
      - "supabase/migrations/*audit_v2_contracts_and_payment_orders.sql"
      - "supabase/migrations/*audit_v2_guest_checkout.sql"
      - "supabase/functions/guest-audit-access/**"
      - "supabase/functions/create-audit-payment-order/**"
      - "supabase/tests/audit-v2-free-entitlement.test.sql"
      - "supabase/tests/audit-v2-migration.test.sql"
      - "supabase/config.toml"
      - ".github/workflows/audit-v2-free-entitlement.yml"
permissions:
  contents: read
jobs:
  postgres-entitlement-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: w3m_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d w3m_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: w3m_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test audit V2 migration on an isolated schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/audit-v2-migration.test.sql
      - name: Test atomic entitlement index behavior
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/audit-v2-free-entitlement.test.sql
  guest-checkout-browser-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate browser audit script syntax
        run: node --check js/code-audit.js
      - name: Verify durable guest payment and report session restore hooks
        run: |
          grep -q 'localStorage.setItem(PENDING_PAYMENT_KEY' js/code-audit.js
          grep -q 'localStorage.removeItem(PENDING_PAYMENT_KEY)' js/code-audit.js
          grep -q 'localStorage.setItem(key,JSON.stringify({token:r.data.session_token' js/code-audit.js
          grep -q 'retryGuestReport' js/code-audit.js
          grep -q 'reportLinkHash:suppliedLinkHash' js/code-audit.js
          grep -q 'existingLinkHash===suppliedLinkHash' js/code-audit.js
          grep -q 'restorePendingPayment(c)' js/code-audit.js
          ! grep -q 'if(!signedIn&&auditType==="code")throw Error' js/code-audit.js
          grep -q 'Guests may purchase the base Code Audit tier' js/code-audit.js
          grep -q 'sessionStorage.removeItem(PENDING_PAYMENT_KEY)' js/code-audit.js
          grep -q 'window.__W3MGuestReportToken = token' code-audit.html
          grep -q 'history.replaceState(null, "", location.pathname' code-audit.html
          grep -q '<meta name="referrer" content="no-referrer">' code-audit.html
          grep -q 'window.__W3MDisableAnalytics = true' code-audit.html
          grep -q 'if (!window.__W3MDisableAnalytics) gtag' code-audit.html
          grep -q 'window.__W3MGuestReportToken||params.get("guest_report")' js/code-audit.js
  transfer-verification-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check payment verifier, guest checkout and report access
        run: deno check supabase/functions/verify-audit-payment/index.ts supabase/functions/create-audit-payment-order/index.ts supabase/functions/guest-audit-access/index.ts supabase/functions/w3m-code-audit/index.ts
      - name: Test exact token transfer matching
        run: deno test --allow-net supabase/functions/verify-audit-payment/payment-verification.test.ts
      - name: Test encrypted guest report token retries
        run: deno test supabase/functions/verify-audit-payment/guest-report-token.test.ts
      - name: Simulate guest payment-to-report workflow state transitions (no external providers)
        run: deno test supabase/functions/verify-audit-payment/audit-v2-workflow-simulation.test.ts

  local-supabase-edge-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3

      - name: Start isolated local Supabase services without incomplete repository migrations
        run: supabase start -x studio,logflare,vector,supavisor,imgproxy,postgres-meta

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check all Audit V2 Edge Functions
        run: |
          deno check supabase/functions/create-audit-payment-order/index.ts
          deno check supabase/functions/verify-audit-payment/index.ts
          deno check supabase/functions/guest-audit-access/index.ts

      - name: Start local Edge Functions with test-only provider settings
        run: |
          cat > /tmp/audit-v2-test.env <<'EOF'
          BSC_RPC_URL=http://127.0.0.1:18545
          RESEND_API_KEY=re_test_only_not_a_real_key
          GUEST_REPORT_TOKEN_ENCRYPTION_KEY=local-test-only-encryption-key-32-bytes-minimum
          EOF
          supabase functions serve --env-file /tmp/audit-v2-test.env > /tmp/audit-v2-functions.log 2>&1 &
          echo $! > /tmp/audit-v2-functions.pid

      - name: Exercise the three real local Edge Function handlers
        run: |
          set -euo pipefail
          STATUS="$(supabase status -o env)"
          ANON_KEY="$(printf '%s\n' "$STATUS" | sed -n 's/^ANON_KEY=//p' | head -n1 | tr -d '"')"
          test -n "$ANON_KEY"
          for attempt in $(seq 1 60); do
            CODE="$(curl --connect-timeout 3 --max-time 10 -sS -o /tmp/create-order.json -w '%{http_code}' \
              -X POST http://127.0.0.1:54321/functions/v1/create-audit-payment-order \
              -H "apikey: $ANON_KEY" -H 'Content-Type: application/json' \
              --data '{"audit_type":"code","repo_url":"https://github.com/example/repo"}' || true)"
            if [ "$CODE" = "400" ]; then break; fi
            sleep 2
          done
          test "$CODE" = "400"
          grep -q 'valid email address' /tmp/create-order.json

          CODE="$(curl --connect-timeout 3 --max-time 10 -sS -o /tmp/verify-payment.json -w '%{http_code}' \
            -X POST http://127.0.0.1:54321/functions/v1/verify-audit-payment \
            -H "apikey: $ANON_KEY" -H 'Content-Type: application/json' \
            --data '{"order_id":"invalid","tx_hash":"invalid"}')"
          test "$CODE" = "400"
          grep -q 'valid order ID' /tmp/verify-payment.json

          CODE="$(curl --connect-timeout 3 --max-time 10 -sS -o /tmp/guest-access.json -w '%{http_code}' \
            -X POST http://127.0.0.1:54321/functions/v1/guest-audit-access \
            -H "apikey: $ANON_KEY" -H 'Content-Type: application/json' \
            --data '{"action":"exchange","report_token":"invalid"}')"
          test "$CODE" = "400"
          grep -q 'Invalid or expired report link' /tmp/guest-access.json

      - name: Show Edge Function logs on failure
        if: failure()
        run: |
          if [ -f /tmp/audit-v2-functions.log ]; then tail -200 /tmp/audit-v2-functions.log; fi
          docker ps -a

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
