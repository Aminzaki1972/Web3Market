name: Passport Scope Checks

on:
  pull_request:
    paths:
      - "ai-passport.html"
      - "passports.html"
      - "sitemap.xml"
      - "js/marketplace-passport.js"
      - "supabase/functions/external-passport-persist/**"
      - "supabase/functions/public-project-passport/**"
      - "supabase/config.toml"
      - ".github/workflows/passport-scope-check.yml"

jobs:
  passport-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Passport JavaScript syntax
        run: node --check js/marketplace-passport.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check safe Passport API
        run: deno check --no-lock supabase/functions/public-project-passport/index.ts
      - name: Validate sitemap XML and retired URL removal
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("sitemap.xml").getroot()
          urls = [node.text or "" for node in root.iter() if node.tag.endswith("loc")]
          assert "https://web3market.xyz/passports.html" in urls
          assert "https://web3market.xyz/ai-passport.html" in urls
          assert not any("/passport/W3M-" in url for url in urls)
          PY
      - name: Ensure general external-search controls are absent
        run: |
          ! grep -q 'externalBtn' ai-passport.html
          ! grep -q 'passport/registry.json' passports.html
      - name: Ensure external Passport persistence is disabled in source
        run: grep -q 'MARKETPLACE_LISTING_REQUIRED' supabase/functions/external-passport-persist/index.ts
      - name: Ensure safe Passport API and audit-history boundary
        run: |
          grep -q 'SUPABASE_SERVICE_ROLE_KEY' supabase/functions/public-project-passport/index.ts
          grep -q 'eq.completed' supabase/functions/public-project-passport/index.ts
          grep -q 'Technical Audit History' js/marketplace-passport.js
