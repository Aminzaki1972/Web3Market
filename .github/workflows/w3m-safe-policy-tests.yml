name: W3M Safe V1 Policy Tests

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/w3m-safe-policy.ts"
      - "supabase/functions/_shared/w3m-safe-policy.test.ts"
      - "supabase/functions/create-safe/index.ts"
      - ".github/workflows/w3m-safe-policy-tests.yml"

permissions:
  contents: read

jobs:
  safe-policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test approved W3M V1 Safe deployment policy
        run: deno test --no-check supabase/functions/_shared/w3m-safe-policy.test.ts
      - name: Type-check Safe policy module
        run: deno check supabase/functions/_shared/w3m-safe-policy.ts
