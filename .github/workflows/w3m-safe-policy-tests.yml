name: W3M Safe V1 Policy Tests

on:
  push:
    branches:
      - "fix/w3m-safe-dynamic-threshold-20261109"
    paths:
      - "supabase/functions/_shared/w3m-safe-policy.ts"
      - "supabase/functions/_shared/w3m-safe-policy.test.ts"
      - "supabase/functions/create-safe/index.ts"
      - "js/w3m-safe-configuration.js"
      - "js/w3m-safe-configuration.test.js"
      - ".github/workflows/w3m-safe-policy-tests.yml"
  pull_request:
    paths:
      - "supabase/functions/_shared/w3m-safe-policy.ts"
      - "supabase/functions/_shared/w3m-safe-policy.test.ts"
      - "supabase/functions/create-safe/index.ts"
      - "js/w3m-safe-configuration.js"
      - "js/w3m-safe-configuration.test.js"
      - ".github/workflows/w3m-safe-policy-tests.yml"

permissions:
  contents: read

jobs:
  safe-policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test approved W3M V1 Safe deployment policy
        run: deno test supabase/functions/_shared/w3m-safe-policy.test.ts js/w3m-safe-configuration.test.js
      - name: Type-check Safe policy and live configuration modules
        run: deno check supabase/functions/_shared/w3m-safe-policy.ts js/w3m-safe-configuration.js
