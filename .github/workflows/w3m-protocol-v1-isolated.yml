permissions:
  contents: read

jobs:
  decision-engine-and-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify deployed Safe v1.4.1 runtime bytecode hash on BNB Chain
        timeout-minutes: 3
        run: deno run --allow-net --allow-env supabase/functions/w3m-acquisition-verification/verify-bnb-safe-v141-runtime-code-hash.ts
      - name: Type-check isolated decision, settlement, payment, and refund modules
        timeout-minutes: 15
        run: |
          deno check \
            supabase/functions/w3m-acquisition-verification/decision-engine.ts \
            supabase/functions/w3m-acquisition-verification/settlement-gate.ts \
            supabase/functions/w3m-acquisition-verification/safe-payload-validator.ts \
