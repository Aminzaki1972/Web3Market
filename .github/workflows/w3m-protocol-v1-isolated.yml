name: W3M Protocol V1 isolated checks

on:
  pull_request:
    paths:
      - "supabase/functions/w3m-acquisition-verification/**"
      - "supabase/migrations/20261105210000_w3m_protocol_v1_evidence_registry.sql"
      - "supabase/migrations/20261105220000_w3m_protocol_v1_trusted_signer_registry.sql"
      - "supabase/migrations/20261106230000_w3m_protocol_v1_safe_execution_attempts.sql"
      - "supabase/migrations/20261106240000_w3m_protocol_v1_safe_execution_finalizer.sql"
      - "supabase/tests/w3m-safe-execution-attempts-fixture.sql"
      - "supabase/tests/w3m-safe-execution-attempts.test.sql"
      - "supabase/tests/w3m-protocol-v1-schema.test.sql"
      - "supabase/tests/w3m-protocol-v1-trusted-signer-schema.test.sql"
      - ".github/workflows/w3m-protocol-v1-isolated.yml"
  push:
    branches:
      - w3m-protocol-v1-isolated-20261105
    paths:
      - "supabase/functions/w3m-acquisition-verification/**"
      - "supabase/migrations/20261105210000_w3m_protocol_v1_evidence_registry.sql"
      - "supabase/migrations/20261105220000_w3m_protocol_v1_trusted_signer_registry.sql"
      - "supabase/migrations/20261106230000_w3m_protocol_v1_safe_execution_attempts.sql"
      - "supabase/migrations/20261106240000_w3m_protocol_v1_safe_execution_finalizer.sql"
      - "supabase/tests/w3m-safe-execution-attempts-fixture.sql"
      - "supabase/tests/w3m-safe-execution-attempts.test.sql"
      - "supabase/tests/w3m-protocol-v1-trusted-signer-schema.test.sql"
      - "supabase/tests/w3m-protocol-v1-schema.test.sql"
      - ".github/workflows/w3m-protocol-v1-isolated.yml"

permissions:
  contents: read

jobs:
  decision-engine-and-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check isolated decision and settlement gate engines
        run: |
          deno check supabase/functions/w3m-acquisition-verification/decision-engine.ts
          deno check supabase/functions/w3m-acquisition-verification/settlement-gate.ts
          deno check supabase/functions/w3m-acquisition-verification/safe-payload-validator.ts
          deno check supabase/functions/w3m-acquisition-verification/safe-multisend-decoder.ts
          deno check supabase/functions/w3m-acquisition-verification/asset-transfer-orchestrator.ts
          deno check supabase/functions/w3m-acquisition-verification/safe-payload-pipeline.test.ts
          deno check supabase/functions/w3m-acquisition-verification/unified-evidence-aggregator.ts
          deno check supabase/functions/w3m-acquisition-verification/report-envelope.ts
          deno check supabase/functions/w3m-acquisition-verification/report-registry-batch.ts
          deno check supabase/functions/w3m-acquisition-verification/protocol-orchestrator.ts
          deno check supabase/functions/w3m-acquisition-verification/protocol-orchestrator.test.ts
          deno check supabase/functions/w3m-acquisition-verification/signature-verifier.ts
          deno check supabase/functions/w3m-acquisition-verification/signature-verifier.test.ts
          deno check supabase/functions/w3m-acquisition-verification/ethereum-signature-adapter.ts
          deno check supabase/functions/w3m-acquisition-verification/ethereum-signature-adapter.test.ts
          deno check supabase/functions/w3m-acquisition-verification/safe-signature-set-validator.ts
          deno check supabase/functions/w3m-acquisition-verification/safe-signature-set-validator.test.ts
          deno check supabase/functions/w3m-acquisition-verification/trusted-signer-registry-adapter.ts
          deno check supabase/functions/w3m-acquisition-verification/trusted-signer-registry-adapter.test.ts
          deno check supabase/functions/w3m-acquisition-verification/supabase-rpc-adapter.ts
          deno check supabase/functions/w3m-acquisition-verification/supabase-rpc-adapter.test.ts
          deno check supabase/functions/w3m-acquisition-verification/protocol-service.ts
          deno check supabase/functions/w3m-acquisition-verification/persisted-report-guard.ts
          deno check supabase/functions/w3m-acquisition-verification/persisted-report-guard.test.ts
          deno check supabase/functions/w3m-acquisition-verification/deal-terms-hash.ts
          deno check supabase/functions/w3m-acquisition-verification/deal-terms-hash.test.ts
          deno check supabase/functions/w3m-acquisition-verification/dealroom-w3m-gate.ts
          deno check supabase/functions/w3m-acquisition-verification/dealroom-w3m-gate.test.ts
          deno check supabase/functions/w3m-acquisition-verification/persisted-report-loader.ts
          deno check supabase/functions/w3m-acquisition-verification/persisted-report-loader.test.ts
          deno check supabase/functions/w3m-acquisition-verification/dealroom-w3m-service.ts
          deno check supabase/functions/w3m-acquisition-verification/dealroom-w3m-service.test.ts
          deno check supabase/functions/w3m-acquisition-verification/dealroom-supabase-adapter.ts
          deno check supabase/functions/w3m-acquisition-verification/dealroom-supabase-adapter.test.ts
      - name: Test decision engine
        run: deno test supabase/functions/w3m-acquisition-verification/decision-engine.test.ts
      - name: Test settlement gate
        run: deno test supabase/functions/w3m-acquisition-verification/settlement-gate.test.ts
      - name: Test Safe payload validator
        run: deno test supabase/functions/w3m-acquisition-verification/safe-payload-validator.test.ts
      - name: Test Safe MultiSend decoder
        run: deno test supabase/functions/w3m-acquisition-verification/safe-multisend-decoder.test.ts
      - name: Test Safe payload pipeline
        run: deno test supabase/functions/w3m-acquisition-verification/safe-payload-pipeline.test.ts
      - name: Test asset transfer orchestrator
        run: deno test supabase/functions/w3m-acquisition-verification/asset-transfer-orchestrator.test.ts
      - name: Test GitHub repository adapter
        run: deno test supabase/functions/w3m-acquisition-verification/github-repository-adapter.test.ts
      - name: Test BNB revenue adapter
        run: deno test supabase/functions/w3m-acquisition-verification/bnb-revenue-adapter.test.ts
      - name: Test NiceNIC domain adapter
        run: deno test supabase/functions/w3m-acquisition-verification/nicenic-domain-adapter.test.ts
      - name: Test unified evidence aggregator
        run: deno test supabase/functions/w3m-acquisition-verification/unified-evidence-aggregator.test.ts
      - name: Test canonical report envelope
        run: deno test supabase/functions/w3m-acquisition-verification/report-envelope.test.ts
      - name: Test signed report registry batch builder
        run: deno test supabase/functions/w3m-acquisition-verification/report-registry-batch.test.ts
      - name: Test W3M Protocol V1 orchestrator
        run: deno test supabase/functions/w3m-acquisition-verification/protocol-orchestrator.test.ts
      - name: Test trusted signer verification policy
        run: deno test supabase/functions/w3m-acquisition-verification/signature-verifier.test.ts
      - name: Test Ethereum secp256k1 signature recovery
        run: deno test supabase/functions/w3m-acquisition-verification/ethereum-signature-adapter.test.ts
      - name: Test Safe execution-time signature set
        run: deno test supabase/functions/w3m-acquisition-verification/safe-signature-set-validator.test.ts
      - name: Test trusted signer registry row mapping
        run: deno test supabase/functions/w3m-acquisition-verification/trusted-signer-registry-adapter.test.ts
      - name: Test Supabase registry and finalization RPC adapter
        run: deno test supabase/functions/w3m-acquisition-verification/supabase-rpc-adapter.test.ts
      - name: Test persisted W3M report and evidence verification
        run: deno test supabase/functions/w3m-acquisition-verification/persisted-report-guard.test.ts
      - name: Test canonical deal terms hashing
        run: deno test supabase/functions/w3m-acquisition-verification/deal-terms-hash.test.ts
      - name: Test combined Deal Room W3M settlement gate
        run: deno test supabase/functions/w3m-acquisition-verification/dealroom-w3m-gate.test.ts
      - name: Test server-side persisted report loader
        run: deno test supabase/functions/w3m-acquisition-verification/persisted-report-loader.test.ts
      - name: Test unified Deal Room W3M service
        run: deno test supabase/functions/w3m-acquisition-verification/dealroom-w3m-service.test.ts
      - name: Test strict Deal Room row adapter
        run: deno test supabase/functions/w3m-acquisition-verification/dealroom-supabase-adapter.test.ts
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply migration to disposable PostgreSQL only
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE anon;"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated;"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE service_role BYPASSRLS;"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/w3m-safe-execution-attempts-fixture.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261105210000_w3m_protocol_v1_evidence_registry.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261105220000_w3m_protocol_v1_trusted_signer_registry.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261106230000_w3m_protocol_v1_safe_execution_attempts.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261106240000_w3m_protocol_v1_safe_execution_finalizer.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/w3m-protocol-v1-schema.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/w3m-protocol-v1-trusted-signer-schema.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/w3m-safe-execution-attempts.test.sql
