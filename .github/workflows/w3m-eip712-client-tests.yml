name: W3M EIP-712 Browser Client Tests

on:
  push:
    branches:
      - "test/w3m-eip712-client-coverage-20261109"
    paths:
      - "js/w3m-deal-agreement-client-signing.test.js"
      - "js/w3m-deal-agreement-client.js"
      - ".github/workflows/w3m-eip712-client-tests.yml"
  pull_request:
    paths:
      - "js/w3m-deal-agreement-client-signing.test.js"
      - "js/w3m-deal-agreement-client.js"
      - ".github/workflows/w3m-eip712-client-tests.yml"

permissions:
  contents: read

jobs:
  eip712-browser-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check isolated agreement client
        run: deno check js/w3m-deal-agreement-client.js
      - name: Run EIP-712 browser client regression tests
        run: deno test --allow-all js/w3m-deal-agreement-client-signing.test.js
