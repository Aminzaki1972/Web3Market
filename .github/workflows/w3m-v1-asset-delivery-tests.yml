name: W3M V1 Asset Delivery Evidence Tests

on:
  pull_request:
    paths:
      - "supabase/migrations/20261108110000_w3m_v1_asset_delivery_evidence.sql"
      - "supabase/migrations/20261108150000_w3m_v1_final_delivery_confirmation.sql"
      - ".github/workflows/w3m-v1-asset-delivery-tests.yml"
  push:
    branches:
      - "feat/w3m-audit-fingerprint-binding-20261107"
    paths:
      - "supabase/migrations/20261108110000_w3m_v1_asset_delivery_evidence.sql"
      - "supabase/migrations/20261108150000_w3m_v1_final_delivery_confirmation.sql"
      - ".github/workflows/w3m-v1-asset-delivery-tests.yml"

permissions:
  contents: read

jobs:
  postgres-asset-evidence-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: w3m_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d w3m_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Supabase-compatible schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d w3m_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create schema w3m_private;
          create schema extensions;
          create extension if not exists pgcrypto with schema extensions;
          create table w3m_private.w3m_acquisition_terms_versions(
            id uuid primary key default gen_random_uuid(),
            deal_id uuid not null,
            terms_version bigint not null default 1,
            terms_hash text not null default repeat('a',64),
            canonical_terms_json jsonb not null,
            status text not null
          );
          create table w3m_private.w3m_agreement_acceptances(
            id uuid primary key default gen_random_uuid(),
            deal_id uuid not null,
            terms_version bigint not null,
            terms_hash text not null,
            party_role text not null,
            user_id uuid not null,
            accepted_at timestamptz not null
          );
          create function auth.jwt() returns jsonb
            language sql stable
            as $auth$ select coalesce(nullif(current_setting('request.jwt.claims', true), '')::jsonb, '{}'::jsonb) $auth$;
          create function auth.uid() returns uuid
            language sql stable
            as $auth$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $auth$;
          create table public.admin_users(user_id uuid primary key);
          create table public.deals(
            id uuid primary key, buyer_id uuid not null, seller_id uuid not null,
            status text not null default 'accepted', dispute_status text not null default 'none',
            release_tx_hash text
          );
          create table public.deal_disputes(
            id uuid primary key default gen_random_uuid(),
            deal_id uuid not null references public.deals(id) on delete cascade,
            status text not null default 'open'
          );
          create table w3m_private.w3m_safe_release_claims(
            id uuid primary key default gen_random_uuid(),
            deal_id uuid not null references public.deals(id) on delete restrict,
            safe_tx_hash text not null,
            safe_nonce bigint not null,
            status text not null,
            transaction_hash text,
            unique(deal_id,safe_tx_hash,safe_nonce)
          );
          create function public.protect_deal_asset_updates()
            returns trigger language plpgsql as $stub$ begin return new; end $stub$;
          create table public.deal_assets(
            id uuid primary key default gen_random_uuid(),
            deal_id uuid not null references public.deals(id) on delete cascade,
            asset_name text not null,
            status text not null default 'pending'
              check(status in ('pending','delivered','accepted','rejected')),
            delivery_url text,
            evidence text,
            delivered_by uuid,
            delivered_at timestamptz,
            accepted_by uuid,
            accepted_at timestamptz,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            unique(deal_id, asset_name)
          );
          alter table public.deal_assets enable row level security;
          create policy deal_assets_participants_update on public.deal_assets
            for update to authenticated using (true) with check (true);
          create trigger protect_deal_asset_updates
            before update on public.deal_assets
            for each row execute function public.protect_deal_asset_updates();
          SQL
      - name: Apply W3M V1 per-asset evidence migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d w3m_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261108110000_w3m_v1_asset_delivery_evidence.sql
      - name: Apply W3M V1 final delivery confirmation migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d w3m_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261108150000_w3m_v1_final_delivery_confirmation.sql
      - name: Verify delivery, rejection, redelivery and acceptance evidence
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d w3m_test -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_deal uuid := '71000000-0000-4000-8000-000000000001';
            v_buyer uuid := '75000000-0000-4000-8000-000000000005';
            v_seller uuid := '76000000-0000-4000-8000-000000000006';
            v_asset uuid;
            v_events integer;
            v_attempt integer;
            v_digest text;
            v_status text;
            v_actor uuid;
            v_evidence jsonb;
            v_confirmation_id uuid;
            v_replay_id uuid;
            v_confirmation_digest text;
            v_confirmation_created boolean;
            v_confirmation_asset_count integer;
            v_final_status jsonb;
          begin
            insert into public.deals(id,buyer_id,seller_id,status,dispute_status)
              values(v_deal,v_buyer,v_seller,'in_progress','none');
            insert into w3m_private.w3m_acquisition_terms_versions(deal_id,canonical_terms_json,status)
            values(v_deal,jsonb_build_object(
              'transfer_scope',jsonb_build_object(
                'included_assets',jsonb_build_array(jsonb_build_object(
                  'type','repository','description','Project source repository'
                ))
              )
            ),'published');
            -- Synthetic accepted-term rows for this isolated SQL-only asset lifecycle test.
            insert into w3m_private.w3m_agreement_acceptances(
              deal_id,terms_version,terms_hash,party_role,user_id,accepted_at
            ) values
              (v_deal,1,repeat('a',64),'buyer',v_buyer,now()),
              (v_deal,1,repeat('a',64),'seller',v_seller,now());
            perform set_config('request.jwt.claims','{"role":"service_role"}',false);
            if public.w3m_sync_deal_assets_from_published_terms(v_deal) <> 1
              or public.w3m_sync_deal_assets_from_published_terms(v_deal) <> 1 then
              raise exception 'signed_asset_checklist_sync_not_idempotent';
            end if;
            select id into v_asset from public.deal_assets
              where deal_id=v_deal and asset_name='repository: Project source repository';
            if v_asset is null then raise exception 'signed_asset_row_not_created'; end if;

            perform set_config('request.jwt.claim.sub',v_seller::text,false);
            update public.deal_assets set status='delivered',
              delivery_url='https://example.invalid/repo',evidence='synthetic-evidence-v1'
              where id=v_asset;
            select count(*) into v_events from w3m_private.w3m_deal_asset_events
              where asset_id=v_asset and event_type='delivered' and attempt_number=1;
            if v_events <> 1 then raise exception 'first_delivery_event_missing'; end if;
            select evidence_digest into v_digest from w3m_private.w3m_deal_asset_events
              where asset_id=v_asset and event_type='delivered';
            if v_digest is null or length(v_digest) <> 64 then
              raise exception 'delivery_evidence_digest_missing_or_invalid';
            end if;
            begin
              update public.deal_assets set evidence='tampered-after-delivery'
                where id=v_asset;
              raise exception 'expected_delivery_evidence_mutation_rejection';
            exception when sqlstate '55000' then null;
            end;

            perform set_config('request.jwt.claim.sub',v_buyer::text,false);
            update public.deal_assets set status='rejected' where id=v_asset;
            select event_type,actor_user_id into v_status,v_actor
              from w3m_private.w3m_deal_asset_events
              where asset_id=v_asset order by occurred_at desc,id desc limit 1;
            if v_status <> 'rejected' or v_actor <> v_buyer then
              raise exception 'buyer_rejection_not_recorded';
            end if;
            perform set_config('request.jwt.claims','{"role":"service_role"}',false);
            begin
              perform public.w3m_confirm_deal_delivery_v1(v_deal,v_buyer);
              raise exception 'expected_final_confirmation_rejection_for_unaccepted_asset';
            exception when sqlstate '55000' then null;
            end;
            begin
              perform public.w3m_claim_safe_release(v_deal,'0x' || repeat('a',64),7);
              raise exception 'expected_safe_claim_rejection_for_unaccepted_asset';
            exception when sqlstate '55000' then null;
            end;

            perform set_config('request.jwt.claim.sub',v_seller::text,false);
            update public.deal_assets set status='delivered',
              delivery_url='https://example.invalid/repo-v2',evidence='synthetic-evidence-v2'
              where id=v_asset;
            select max(attempt_number) into v_attempt
              from w3m_private.w3m_deal_asset_events
              where asset_id=v_asset and event_type='delivered';
            if v_attempt <> 2 then raise exception 'redelivery_attempt_not_incremented'; end if;
            if (select accepted_by from public.deal_assets where id=v_asset) is not null
              or (select accepted_at from public.deal_assets where id=v_asset) is not null then
              raise exception 'previous_acceptance_not_cleared_on_redelivery';
            end if;

            perform set_config('request.jwt.claim.sub',v_buyer::text,false);
            update public.deal_assets set status='accepted' where id=v_asset;
            select count(*) into v_events from w3m_private.w3m_deal_asset_events
              where asset_id=v_asset;
            if v_events <> 4 then raise exception 'event_history_was_overwritten_or_duplicated'; end if;
            select event_type,attempt_number into v_status,v_attempt
              from w3m_private.w3m_deal_asset_events
              where asset_id=v_asset order by occurred_at desc,id desc limit 1;
            if v_status <> 'accepted' or v_attempt <> 2 then
              raise exception 'latest_delivery_attempt_not_accepted';
            end if;

            begin
              update w3m_private.w3m_deal_asset_events
                set event_type='rejected' where asset_id=v_asset;
              raise exception 'expected_append_only_update_rejection';
            exception when sqlstate '55000' then null;
            end;
            begin
              delete from w3m_private.w3m_deal_asset_events where asset_id=v_asset;
              raise exception 'expected_append_only_delete_rejection';
            exception when sqlstate '55000' then null;
            end;

            perform set_config('request.jwt.claims','{"role":"service_role"}',false);
            select asset_rows into v_evidence
              from public.w3m_get_deal_asset_finalization_evidence(v_deal);
            if jsonb_array_length(v_evidence) <> 1
              or v_evidence #>> '{0,status}' <> 'accepted'
              or jsonb_array_length(v_evidence #> '{0,events}') <> 4 then
              raise exception 'service_finalization_asset_evidence_incomplete';
            end if;

            -- Every asset is accepted, but Safe release still requires a separate final buyer confirmation.
            begin
              perform public.w3m_claim_safe_release(v_deal,'0x' || repeat('a',64),7);
              raise exception 'safe_claim_must_wait_for_buyer_final_delivery_confirmation';
            exception when sqlstate '55000' then null;
            end;

            select confirmation_id,asset_set_digest,asset_count,created
              into v_confirmation_id,v_confirmation_digest,v_confirmation_asset_count,v_confirmation_created
              from public.w3m_confirm_deal_delivery_v1(v_deal,v_buyer);
            if v_confirmation_id is null or v_confirmation_created is not true
              or v_confirmation_asset_count <> 1 or length(v_confirmation_digest) <> 64 then
              raise exception 'buyer_final_delivery_confirmation_not_recorded';
            end if;
            v_final_status := public.w3m_get_deal_delivery_confirmation_status(v_deal);
            if v_final_status->>'confirmed' <> 'true' or v_final_status->>'stale' <> 'false' then
              raise exception 'final_delivery_confirmation_status_not_current';
            end if;

            select confirmation_id,created into v_replay_id,v_confirmation_created
              from public.w3m_confirm_deal_delivery_v1(v_deal,v_buyer);
            if v_replay_id <> v_confirmation_id or v_confirmation_created is not false then
              raise exception 'final_delivery_confirmation_retry_not_idempotent';
            end if;
            begin
              update w3m_private.w3m_deal_delivery_confirmations
                set asset_count=2 where id=v_confirmation_id;
              raise exception 'expected_final_confirmation_append_only_update_rejection';
            exception when sqlstate '55000' then null;
            end;
            begin
              delete from w3m_private.w3m_deal_delivery_confirmations where id=v_confirmation_id;
              raise exception 'expected_final_confirmation_append_only_delete_rejection';
            exception when sqlstate '55000' then null;
            end;

            -- A later seller redelivery invalidates the previous final confirmation.
            perform set_config('request.jwt.claim.sub',v_seller::text,false);
            update public.deal_assets set status='delivered',
              delivery_url='https://example.invalid/repo-v3',evidence='synthetic-evidence-v3'
              where id=v_asset;
            perform set_config('request.jwt.claim.sub',v_buyer::text,false);
            update public.deal_assets set status='accepted' where id=v_asset;
            perform set_config('request.jwt.claims','{"role":"service_role"}',false);
            v_final_status := public.w3m_get_deal_delivery_confirmation_status(v_deal);
            if v_final_status->>'confirmed' <> 'false' or v_final_status->>'stale' <> 'true' then
              raise exception 'redelivery_did_not_invalidate_previous_final_confirmation';
            end if;
            begin
              perform public.w3m_claim_safe_release(v_deal,'0x' || repeat('a',64),7);
              raise exception 'safe_claim_must_wait_for_reconfirmed_asset_set';
            exception when sqlstate '55000' then null;
            end;

            select confirmation_id,asset_set_digest,created
              into v_replay_id,v_confirmation_digest,v_confirmation_created
              from public.w3m_confirm_deal_delivery_v1(v_deal,v_buyer);
            if v_replay_id is null or v_replay_id = v_confirmation_id
              or v_confirmation_created is not true or v_confirmation_digest = v_final_status->>'asset_set_digest' then
              raise exception 'new_asset_set_was_not_reconfirmed';
            end if;
            v_final_status := public.w3m_get_deal_delivery_confirmation_status(v_deal);
            if v_final_status->>'confirmed' <> 'true' or v_final_status->>'stale' <> 'false' then
              raise exception 'reconfirmed_asset_set_not_current';
            end if;

            perform public.w3m_claim_safe_release(v_deal,'0x' || repeat('a',64),7);
            perform set_config('request.jwt.claim.sub',v_seller::text,false);
            begin
              update public.deal_assets set status='pending' where id=v_asset;
              raise exception 'expected_asset_mutation_rejection_after_safe_claim';
            exception when sqlstate '55000' then null;
            end;
          end;
          $$;
          SQL
      - name: Verify authenticated per-asset transition RPC
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d w3m_test -v ON_ERROR_STOP=1 <<'SQL'
          do $asset_transition_test$
          declare
            v_deal uuid := '71100000-0000-4000-8000-000000000001';
            v_buyer uuid := '75100000-0000-4000-8000-000000000005';
            v_seller uuid := '76100000-0000-4000-8000-000000000006';
            v_asset uuid;
            v_result jsonb;
          begin
            insert into public.deals(id,buyer_id,seller_id) values(v_deal,v_buyer,v_seller);
            insert into public.deal_assets(deal_id,asset_name,status)
              values(v_deal,'repository: RPC test','pending') returning id into v_asset;
            perform set_config('request.jwt.claims','{"role":"service_role"}',false);
            v_result := public.w3m_transition_deal_asset_v1(
              v_deal,v_asset,v_seller,'deliver','https://example.invalid/repo','synthetic-evidence'
            );
            if v_result->>'status' <> 'delivered' or (v_result->>'attempt_number')::int <> 1 then
              raise exception 'authenticated_seller_delivery_rpc_failed';
            end if;
            begin
              perform public.w3m_transition_deal_asset_v1(
                v_deal,v_asset,v_seller,'accept',null,null
              );
              raise exception 'seller_must_not_accept_own_delivery';
            exception when sqlstate '42501' then null;
            end;
            begin
              perform public.w3m_transition_deal_asset_v1(
                v_deal,v_asset,v_seller,'deliver','http://insecure.invalid/repo','bad'
              );
              raise exception 'insecure_delivery_url_must_be_rejected';
            exception when sqlstate '22023' then null;
            end;
            v_result := public.w3m_transition_deal_asset_v1(
              v_deal,v_asset,v_buyer,'reject',null,null
            );
            if v_result->>'status' <> 'rejected' then
              raise exception 'buyer_rejection_rpc_failed';
            end if;
            v_result := public.w3m_transition_deal_asset_v1(
              v_deal,v_asset,v_seller,'deliver','https://example.invalid/repo-v2','synthetic-evidence-v2'
            );
            if v_result->>'status' <> 'delivered' or (v_result->>'attempt_number')::int <> 2 then
              raise exception 'seller_redelivery_rpc_failed';
            end if;
            v_result := public.w3m_transition_deal_asset_v1(
              v_deal,v_asset,v_buyer,'accept',null,null
            );
            if v_result->>'status' <> 'accepted' then
              raise exception 'buyer_acceptance_rpc_failed';
            end if;
            begin
              perform public.w3m_transition_deal_asset_v1(
                v_deal,v_asset,'79100000-0000-4000-8000-000000000009'::uuid,'reject',null,null
              );
              raise exception 'nonparticipant_must_not_change_asset';
            exception when sqlstate '42501' then null;
            end;
          end;
          $asset_transition_test$;
          SQL
      - name: Verify per-asset transition RPC is service-role only
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d w3m_test -v ON_ERROR_STOP=1 <<'SQL'
          do $asset_transition_test$
          begin
            if has_function_privilege('anon','public.w3m_transition_deal_asset_v1(uuid,uuid,uuid,text,text,text)','execute')
              or has_function_privilege('authenticated','public.w3m_transition_deal_asset_v1(uuid,uuid,uuid,text,text,text)','execute')
              or not has_function_privilege('service_role','public.w3m_transition_deal_asset_v1(uuid,uuid,uuid,text,text,text)','execute') then
              raise exception 'asset_transition_rpc_privileges_are_not_least_privilege';
            end if;
          end;
          $asset_transition_test$;
          SQL
      - name: Verify finalization evidence RPC is service-role only
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d w3m_test -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if has_function_privilege('anon','public.w3m_get_deal_asset_finalization_evidence(uuid)','execute')
              or has_function_privilege('authenticated','public.w3m_get_deal_asset_finalization_evidence(uuid)','execute')
              or not has_function_privilege('service_role','public.w3m_get_deal_asset_finalization_evidence(uuid)','execute')
              or has_table_privilege('anon','w3m_private.w3m_deal_asset_events','select')
              or has_table_privilege('authenticated','w3m_private.w3m_deal_asset_events','select')
              or has_table_privilege('service_role','w3m_private.w3m_deal_asset_events','select') then
              raise exception 'asset_delivery_evidence_privileges_are_not_least_privilege';
            end if;
          end;
          $$;
          SQL
      - name: Verify final delivery confirmation RPC and table privileges
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d w3m_test -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if has_function_privilege('anon','public.w3m_confirm_deal_delivery_v1(uuid,uuid)','execute')
              or has_function_privilege('authenticated','public.w3m_confirm_deal_delivery_v1(uuid,uuid)','execute')
              or not has_function_privilege('service_role','public.w3m_confirm_deal_delivery_v1(uuid,uuid)','execute')
              or has_function_privilege('anon','public.w3m_get_deal_delivery_confirmation_status(uuid)','execute')
              or has_function_privilege('authenticated','public.w3m_get_deal_delivery_confirmation_status(uuid)','execute')
              or not has_function_privilege('service_role','public.w3m_get_deal_delivery_confirmation_status(uuid)','execute')
              or has_table_privilege('anon','w3m_private.w3m_deal_delivery_confirmations','select')
              or has_table_privilege('authenticated','w3m_private.w3m_deal_delivery_confirmations','select')
              or has_table_privilege('service_role','w3m_private.w3m_deal_delivery_confirmations','select') then
              raise exception 'final_delivery_confirmation_privileges_are_not_least_privilege';
            end if;
          end;
          $$;
          SQL
