name: Deploy W3M External Project Passport

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/external-project-passport/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-external-project-passport.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-external-project-passport
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hzhqlexnhtukfljcvnyd
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate required secret
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy external-project-passport
        run: supabase functions deploy external-project-passport --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
