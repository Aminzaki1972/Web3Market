name: Admin Review AAL tests

on:
  push:
    branches:
      - security/admin-review-aal2-test
    paths:
      - 'scripts/test-admin-review-aal.mjs'
      - 'supabase/functions/_shared/aal.mjs'
      - 'supabase/functions/admin-review/index.ts'
      - '.github/workflows/admin-review-aal-tests.yml'
  pull_request:
    paths:
      - 'scripts/test-admin-review-aal.mjs'
      - 'supabase/functions/_shared/aal.mjs'
      - 'supabase/functions/admin-review/index.ts'
      - '.github/workflows/admin-review-aal-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run AAL parser tests
        run: node --test scripts/test-admin-review-aal.mjs
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Function
        run: deno check supabase/functions/admin-review/index.ts
