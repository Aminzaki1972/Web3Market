name: Private support chat static checks

on:
  pull_request:
    paths:
      - "js/support-chat.js"
      - "support-chat.html"
      - "admin-support.html"
      - "buyer-dashboard.html"
      - "seller-dashboard.html"
      - "admin-review.html"
      - "supabase/migrations/20261020_private_support_chat.sql"
      - "docs/private-support-chat-test-plan.md"
      - ".github/workflows/private-support-chat-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check js/support-chat.js
      - name: Check critical support-chat safeguards
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const js = fs.readFileSync('js/support-chat.js', 'utf8');
          const sql = fs.readFileSync('supabase/migrations/20261020_private_support_chat.sql', 'utf8');
          const userPage = fs.readFileSync('support-chat.html', 'utf8');
          const adminPage = fs.readFileSync('admin-support.html', 'utf8');
          const buyerDashboard = fs.readFileSync('buyer-dashboard.html', 'utf8');
          const sellerDashboard = fs.readFileSync('seller-dashboard.html', 'utf8');
          const adminReview = fs.readFileSync('admin-review.html', 'utf8');
          const checks = [
            ['private attachment bucket', js.includes('"support-attachments"')],
            ['20 MiB attachment limit', js.includes('20 * 1024 * 1024')],
            ['user conversation records include owner ID for attachment paths', /select\(\"id,user_id,subject,status,last_message_at\"\)/.test(js) && /conversation\.id\+\"\/\"\+conversation\.user_id\+\"\/\"/.test(js)],
            ['signed attachment URLs', /createSignedUrl\s*\(/.test(js)],
            ['admin requires AAL2', /currentLevel\s*===?\s*["']aal2["']|currentLevel\s*!==\s*["']aal2["']/.test(js)],
            ['stale render guard', /renderSequence/.test(js)],
            ['stale selected conversation guard', /currentConversation/.test(js) && /loadAdminMessages/.test(js)],
            ['table-level update revoked', /revoke\s+update\s+on\s+public\.support_conversations\s+from\s+public\s*,\s*anon\s*,\s*authenticated/i.test(sql)],
            ['status-only update grant', /grant\s+update\s*\(\s*status\s*\)\s+on\s+public\.support_conversations\s+to\s+authenticated/i.test(sql)],
            ['private bucket configured', /values\s*\(\s*'support-attachments'\s*,\s*'support-attachments'\s*,\s*false/i.test(sql)],
            ['closed conversations block uploads', /c\.status\s*=\s*'open'/i.test(sql)],
            ['conversation reads restricted to participant or AAL2 admin', /support_conversations_select_participant_or_admin[\s\S]{0,700}?public\.is_admin\(\)[\s\S]{0,100}?aal2[\s\S]{0,300}?user_id\s*=\s*\(select auth\.uid\(\)\)[\s\S]{0,300}?buyer[\s\S]{0,100}?seller/i.test(sql)],
            ['new conversations must belong to current buyer/seller and be open', /support_conversations_insert_own[\s\S]{0,450}?user_id\s*=\s*\(select auth\.uid\(\)\)[\s\S]{0,180}?status\s*=\s*'open'[\s\S]{0,250}?buyer[\s\S]{0,100}?seller/i.test(sql)],
            ['message sender must match authenticated user', /support_messages_insert_sender_authorized[\s\S]{0,250}?sender_id\s*=\s*\(select auth\.uid\(\)\)/i.test(sql)],
            ['message attachment path bound to conversation owner', /split_part\(attachment_path,\s*'\/',\s*1\)\s*=\s*c\.id::text[\s\S]{0,120}?split_part\(attachment_path,\s*'\/',\s*2\)\s*=\s*c\.user_id::text/i.test(sql)],
            ['no support attachment update/delete policies', !/create\s+policy\s+\w+\s+on\s+storage\.objects\s+for\s+(update|delete)[\s\S]{0,120}?support-attachments/i.test(sql)],
            ['separate user/admin pages', userPage.includes('support-chat.js') && adminPage.includes('support-chat.js')],
            ['buyer dashboard links to private support', /href=[\"']support-chat\.html[\"']/.test(buyerDashboard)],
            ['seller dashboard links to private support', /href=[\"']support-chat\.html[\"']/.test(sellerDashboard)],
            ['admin review links to private inbox', /href=[\"']admin-support\.html[\"']/.test(adminReview)],
            ['manual test plan exists', fs.existsSync('docs/private-support-chat-test-plan.md')],
          ];
          for (const [name, ok] of checks) {
            console.log(`${ok ? 'PASS' : 'FAIL'}: ${name}`);
          }
          assert.ok(checks.every(([, ok]) => ok), 'One or more private support-chat safeguards are missing.');
          NODE
