name: Isolated W3M trust badge checks

on:
  pull_request:
    paths:
      - "supabase/functions/w3m-code-audit/**"
      - "supabase/functions/w3m-trust-badge/**"
      - "supabase/functions/w3m-trust-badge-approve/**"
      - "supabase/config.toml"
      - ".github/workflows/trust-badge-isolated-tests.yml"
  push:
    branches:
      - feature/trust-badge-isolated-20261031
    paths:
      - "supabase/functions/w3m-code-audit/**"
      - "supabase/functions/w3m-trust-badge/**"
      - "supabase/config.toml"
      - ".github/workflows/trust-badge-isolated-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check audit worker and trust badge endpoint
        run: |
          deno check supabase/functions/w3m-code-audit/index.ts
          deno check supabase/functions/w3m-trust-badge/index.ts
          deno check supabase/functions/w3m-trust-badge-approve/index.ts
      - name: Run trust badge eligibility tests
        run: deno test supabase/functions/w3m-trust-badge/eligibility.test.ts
      - name: Run structured evidence aggregation tests
        run: deno test supabase/functions/w3m-code-audit/trust-badge-evidence.test.ts
      - name: Run related audit worker unit tests
        run: |
          deno test supabase/functions/w3m-code-audit/audit-progress.test.ts
          deno test supabase/functions/w3m-code-audit/audit-pagination.test.ts
          deno test supabase/functions/w3m-code-audit/audit-findings.test.ts
          deno test supabase/functions/w3m-code-audit/audit-persistence.test.ts
