name: Next.js migration preview

on:
  push:
    branches:
      - nextjs-migration
    paths:
      - "nextjs/**"
      - ".github/workflows/nextjs-preview.yml"
  pull_request:
    branches:
      - main
    paths:
      - "nextjs/**"
      - ".github/workflows/nextjs-preview.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build Next.js preview
        run: npm run build
