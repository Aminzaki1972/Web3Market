name: Fix seller entry routing

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: web3market-seller-entry
  cancel-in-progress: true

jobs:
  fix-seller-entry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fix homepage seller links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'href="sell-project.html">List Your Project</a>'
          new = 'href="register.html?role=seller">List Your Project</a>'
          if old in s:
              s = s.replace(old, new, 1)
          old2 = 'href="register.html">Create Seller Account</a>'
          new2 = 'href="register.html?role=seller">Create Seller Account</a>'
          s = s.replace(old2, new2)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: route homepage seller CTAs to registration"
          git push
