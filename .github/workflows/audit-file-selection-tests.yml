name: Audit file selection tests
on:
  pull_request:
    paths:
      - "supabase/functions/w3m-code-audit/**"
      - ".github/workflows/audit-file-selection-tests.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/w3m-code-audit/**"
      - ".github/workflows/audit-file-selection-tests.yml"
jobs:
  audit-selection-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run audit selection unit tests
        run: deno test supabase/functions/w3m-code-audit/audit-selection.test.ts
