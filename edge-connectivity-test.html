<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web3Market Edge Connectivity Test</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#e5e7eb;padding:24px;line-height:1.5}
main{max-width:720px;margin:auto;background:#111827;border:1px solid #334155;border-radius:16px;padding:20px}
button{padding:12px 18px;border:0;border-radius:10px;cursor:pointer}
pre{white-space:pre-wrap;background:#020617;padding:14px;border-radius:10px;overflow:auto}
.ok{color:#86efac}.err{color:#fca5a5}
</style>
</head>
<body>
<main>
<h2>Web3Market — Edge Function Connectivity Test</h2>
<p>This page only tests browser → Supabase Edge Function connectivity. It does not create a Safe and does not move BNB or USDT.</p>
<p><strong>Test version:</strong> 3 — uses the same Web3Market Supabase client as the live site.</p>
<button id="run">Run connectivity test</button>
<pre id="out">Ready.</pre>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js?v=20260918-edge-test-3"></script>
<script>
const out=document.getElementById("out");
const log=(s,cls)=>{out.className=cls||"";out.textContent=s};
async function waitForClient(timeout=10000){
  const start=Date.now();
  while(Date.now()-start<timeout){
    if(window.Web3MarketSupabase?.getClient){
      const c=window.Web3MarketSupabase.getClient();
      if(c)return c;
    }
    await new Promise(r=>setTimeout(r,200));
  }
  throw new Error("Web3Market Supabase client did not initialize.");
}
document.getElementById("run").onclick=async()=>{
  log("Testing...");
  try{
    const client=await waitForClient();
    const {data,error}=await client.auth.getSession();
    if(error)throw error;
    if(!data.session)throw new Error("No active Web3Market session found. Sign in first, then run the test again.");
    const r=await client.functions.invoke("safe-connect-test",{
      body:{source:"edge-connectivity-test-v3"},
      headers:{Authorization:"Bearer "+data.session.access_token}
    });
    if(r.error)throw r.error;
    log("SUCCESS\n\n"+JSON.stringify(r.data,null,2),"ok");
  }catch(e){
    log("FAILED\n\n"+(e&&e.message?e.message:String(e)), "err");
    console.error("Edge connectivity test:",e);
  }
};
</script>
</main>
</body>
</html>
