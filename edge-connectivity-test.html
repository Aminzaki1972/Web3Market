<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web3Market Edge Connectivity Test</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#e5e7eb;padding:24px;line-height:1.5}
main{max-width:720px;margin:auto;background:#111827;border:1px solid #334155;border-radius:16px;padding:20px}
button{padding:12px 18px;border:0;border-radius:10px;cursor:pointer}
pre{white-space:pre-wrap;background:#020617;padding:14px;border-radius:10px;overflow:auto}
.ok{color:#86efac}.err{color:#fca5a5}
</style>
</head>
<body>
<main>
<h2>Web3Market — Edge Function Connectivity Test</h2>
<p>This diagnostic bypasses the Supabase JavaScript client. It only tests browser → Supabase Edge Function connectivity. It does not create a Safe and does not move BNB or USDT.</p>
<p><strong>Test version:</strong> 4 — direct Edge Function request.</p>
<button id="run">Run connectivity test</button>
<pre id="out">Ready.</pre>
<script>
const OUT=document.getElementById("out");
const log=(s,cls)=>{OUT.className=cls||"";OUT.textContent=s};
const FN_URL="https://hzhqlexnhtukfljcvnyd.supabase.co/functions/v1/safe-connect-test";
document.getElementById("run").onclick=async()=>{
  log("Testing...");
  try{
    const raw=localStorage.getItem("web3market-auth");
    if(!raw)throw new Error("No web3market-auth session found. Sign in to Web3Market first.");
    const saved=JSON.parse(raw);
    const token=saved?.access_token;
    if(!token)throw new Error("No access_token found in the Web3Market session.");
    const res=await fetch(FN_URL,{
      method:"POST",
      mode:"cors",
      headers:{
        "Authorization":"Bearer "+token,
        "apikey":"sb_publishable_lO7uEsiM0T8oeHB75DMxkA_287VZ9eI",
        "Content-Type":"application/json"
      },
      body:JSON.stringify({source:"edge-connectivity-test-v4"})
    });
    const text=await res.text();
    let data=text;
    try{data=JSON.parse(text)}catch(_){}
    if(!res.ok)throw new Error("HTTP "+res.status+" — "+(typeof data==="string"?data:JSON.stringify(data)));
    log("SUCCESS\n\n"+JSON.stringify(data,null,2),"ok");
  }catch(e){
    log("FAILED\n\n"+(e&&e.message?e.message:String(e)), "err");
    console.error("Edge connectivity test:",e);
  }
};
</script>
</main>
</body>
</html>
