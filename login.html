<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sign in to Web3Market"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Sign In — Web3Market</title><link rel="stylesheet" href="css/style.css"><style>body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#f5f7fb;color:#172033;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,440px);padding:36px;box-sizing:border-box;background:#fff;border:1px solid #e5e9f0;border-radius:18px;box-shadow:0 16px 45px rgba(20,30,50,.10)}h1{margin:0 0 10px;font-size:32px;color:#111827}.card>p{color:#667085;line-height:1.6}.field{margin:20px 0}.field label{display:block;margin-bottom:8px;color:#344054;font-weight:600;font-size:14px}.field input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #d0d5dd;background:#fff;color:#101828;font:inherit;outline:none}.btn{width:100%;padding:14px;border:0;border-radius:10px;font:inherit;font-weight:800;cursor:pointer;background:#635bff;color:#fff}.btn:disabled{opacity:.55}.link{display:block;margin-top:14px;color:#635bff;text-align:center;text-decoration:none;font-size:14px}.secondary{display:block;text-align:center;margin-top:12px;text-decoration:none;color:#344054;border:1px solid #d0d5dd;padding:13px;border-radius:10px}.msg{display:none;margin-top:18px;padding:13px;border-radius:10px;font-size:14px;line-height:1.5}.msg.show{display:block}.ok{background:#ecfdf3;color:#067647}.err{background:#fef3f2;color:#b42318}.home{display:inline-block;margin-bottom:25px;color:#635bff;text-decoration:none;font-weight:600}.small{font-size:12px;color:#98a2b3;margin-top:16px}</style></head><body><main class="card"><a class="home" href="index.html">← Web3Market</a><h1>Welcome back</h1><p>Sign in with your Web3Market email and password.</p><form id="form" novalidate><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"></div><button id="btn" class="btn" type="submit">Sign in</button></form><a class="link" href="forgot-password.html">Forgot your password?</a><a class="link" id="resend" href="#">Resend confirmation email</a><div id="msg" class="msg" role="status" aria-live="polite"></div><a class="secondary" href="register.html">Create a new account</a><p class="small">Web3Market Auth Fix 6 • single Supabase client.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20260913-authfix6"></script><script>(async function(){const f=document.getElementById('form'),em=document.getElementById('email'),pw=document.getElementById('password'),b=document.getElementById('btn'),r=document.getElementById('resend'),m=document.getElementById('msg');const params=new URLSearchParams(location.search),R='web3market_offer_return_to',ret=String(params.get('returnTo')||'').trim(),valid=ret.startsWith('project.html?id=')&&!ret.includes('://');try{if(valid){sessionStorage.setItem(R,ret);sessionStorage.setItem('web3market_offer_flow','1')}else{sessionStorage.removeItem(R);sessionStorage.removeItem('web3market_offer_flow')}}catch(_){}const getReturn=()=>{try{if(sessionStorage.getItem('web3market_offer_flow')!=='1')return '';const x=String(sessionStorage.getItem(R)||'').trim();return x.startsWith('project.html?id=')&&!x.includes('://')?x:''}catch(_){return ''}},clearReturn=()=>{try{sessionStorage.removeItem(R);sessionStorage.removeItem('web3market_offer_flow')}catch(_){}},show=(t,ok)=>{m.textContent=t;m.className='msg show '+(ok?'ok':'err')};let sb=null;for(let i=0;i<100&&!sb;i++){sb=window.Web3MarketSupabase?.getClient?.()||window.Web3MarketSupabase?.client||window.supabaseClient||window.web3marketSupabase||null;if(!sb?.auth){sb=null;await new Promise(x=>setTimeout(x,100))}}if(!sb){show('Web3Market authentication is unavailable. Please reload the page.',false);return}async function route(user){if(!user)throw new Error('Session could not be restored.');const {data:p,error}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(error)throw error;const role=String(p?.role||'').trim().toLowerCase(),to=getReturn();if(role==='buyer'){clearReturn();location.replace(to||'buyer-dashboard.html');return}if(role==='seller'){clearReturn();location.replace('seller-dashboard.html');return}throw new Error('Your account role is missing or invalid.')}f.addEventListener('submit',async e=>{e.preventDefault();const email=em.value.trim().toLowerCase(),password=pw.value;if(!email||!password){show('Please enter your email and password.',false);return}b.disabled=true;b.textContent='Signing in…';try{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;if(!data?.session||!data?.user)throw new Error('Authentication succeeded but no session was returned.');if(!data.user.email_confirmed_at){await sb.auth.signOut();throw new Error('Please confirm your email before signing in.')}let session=null;for(let i=0;i<30;i++){const s=await sb.auth.getSession();if(s?.data?.session?.user){session=s.data.session;break}await new Promise(x=>setTimeout(x,150))}if(!session)throw new Error('Your session was not persisted. Please try signing in again.');await route(session.user)}catch(e){console.error('Web3Market login:',e);const msg=String(e?.message||'Sign in failed.');show(/invalid login credentials/i.test(msg)?'Incorrect email or password.':/email.*not.*confirm|confirm.*email/i.test(msg)?'Please confirm your email before signing in.':msg,false)}finally{b.disabled=false;b.textContent='Sign in'}});r.addEventListener('click',async e=>{e.preventDefault();const email=em.value.trim().toLowerCase();if(!email)return show('Enter your email address first.',false);try{const {error}=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:new URL('login.html',location.href).href}});if(error)throw error;show('Confirmation email sent.',true)}catch(e){show(e.message||'Unable to resend confirmation email.',false)}})})();</script></body></html>
