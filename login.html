<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sign in to Web3Market"><title>Sign In — Web3Market</title><link rel="stylesheet" href="css/style.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#07111f;color:#f8fafc;font-family:Inter,system-ui,sans-serif}.card{width:min(100%,460px);padding:36px;border:1px solid rgba(148,163,184,.16);border-radius:22px;background:#0d1b2d;box-shadow:0 20px 60px rgba(0,0,0,.28)}h1{margin:0 0 10px;font-size:34px}p{color:#94a3b8;line-height:1.6}.field{margin:22px 0}.field label{display:block;margin-bottom:8px;color:#cbd5e1;font-weight:600;font-size:14px}.field input{width:100%;padding:15px;border-radius:12px;border:1px solid rgba(148,163,184,.22);background:#07111f;color:#fff;box-sizing:border-box;font:inherit;outline:none}.btn{width:100%;padding:15px;border:0;border-radius:12px;font:inherit;font-weight:800;cursor:pointer;background:#38bdf8;color:#06101b}.btn:disabled{opacity:.55}.link{display:block;margin-top:14px;color:#6ee7ff;text-align:center;text-decoration:none;font-size:14px}.secondary{display:block;text-align:center;margin-top:12px;text-decoration:none;color:#cbd5e1;border:1px solid rgba(148,163,184,.22);padding:14px;border-radius:12px}.msg{display:none;margin-top:18px;padding:13px;border-radius:10px;font-size:14px;line-height:1.5}.msg.show{display:block}.ok{background:rgba(34,197,94,.08);color:#86efac}.err{background:rgba(239,68,68,.08);color:#fca5a5}.home{display:inline-block;margin-bottom:25px;color:#6ee7ff;text-decoration:none}.small{font-size:12px;color:#64748b;margin-top:16px}</style></head><body><main class="card"><a class="home" href="index.html">← Web3Market</a><h1>Welcome back</h1><p>Sign in with your Web3Market email and password.</p><form id="form" novalidate><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"></div><button id="btn" class="btn" type="submit">Sign in</button></form><a class="link" href="forgot-password.html">Forgot your password?</a><a class="link" id="resend" href="#">Resend confirmation email</a><div id="msg" class="msg" role="status" aria-live="polite"></div><a class="secondary" href="register.html">Create a new account</a><p class="small">Your email must be confirmed before access to your Web3Market account is allowed.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20260822-11"></script><script src="js/auth.js?v=20260822-7"></script><script>(async function(){const sb=window.Web3MarketSupabase?.getClient?.()||window.supabaseClient;const form=document.getElementById('form'),email=document.getElementById('email'),password=document.getElementById('password'),btn=document.getElementById('btn'),resend=document.getElementById('resend'),msg=document.getElementById('msg');function show(t,ok){msg.textContent=t;msg.className='msg show '+(ok?'ok':'err')}async function roleRedirect(){const {data:userData,error:userError}=await sb.auth.getUser();if(userError)throw userError;const user=userData?.user;if(!user)throw new Error('Session could not be loaded.');const {data,error}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(error)throw error;const role=String(data?.role||'').toLowerCase();if(role==='buyer')return location.replace('buyer-dashboard.html');if(role==='seller')return location.replace('seller-dashboard.html');throw new Error('Your account role is missing or invalid.')}form.addEventListener('submit',async e=>{e.preventDefault();const em=email.value.trim().toLowerCase(),pw=password.value;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return show('Please enter a valid email address.',false);if(!pw)return show('Please enter your password.',false);if(!sb)return show('Unable to connect to Web3Market.',false);btn.disabled=true;btn.textContent='Signing in…';try{const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error;if(!data?.user?.email_confirmed_at){await sb.auth.signOut();throw new Error('Please confirm your email before signing in.')}await roleRedirect()}catch(err){show(/invalid login credentials/i.test(err.message)?'Incorrect email or password.':String(err.message||'Sign in failed.'),false)}finally{btn.disabled=false;btn.textContent='Sign in'}});resend.addEventListener('click',async e=>{e.preventDefault();const em=email.value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return show('Enter your email address first.',false);try{const {error}=await sb.auth.resend({type:'signup',email:em,options:{emailRedirectTo:new URL('login.html',location.href).href}});if(error)throw error;show('Confirmation email sent. Open the link in your email.',true)}catch(err){show(String(err.message||'Unable to resend confirmation email.'),false)}})})();</script></body></html>
