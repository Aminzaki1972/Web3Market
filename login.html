<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sign in to Web3Market"><title>Sign In — Web3Market</title><link rel="stylesheet" href="css/style.css"><style>body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#f5f7fb;color:#172033;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,440px);padding:36px;box-sizing:border-box;background:#fff;border:1px solid #e5e9f0;border-radius:18px;box-shadow:0 16px 45px rgba(20,30,50,.10)}h1{margin:0 0 10px;font-size:32px;color:#111827}.card>p{color:#667085;line-height:1.6}.field{margin:20px 0}.field label{display:block;margin-bottom:8px;color:#344054;font-weight:600;font-size:14px}.field input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #d0d5dd;background:#fff;color:#101828;font:inherit;outline:none}.field input:focus{border-color:#635bff;box-shadow:0 0 0 3px rgba(99,91,255,.12)}.btn{width:100%;padding:14px;border:0;border-radius:10px;font:inherit;font-weight:800;cursor:pointer;background:#635bff;color:#fff}.btn:disabled{opacity:.55}.link{display:block;margin-top:14px;color:#635bff;text-align:center;text-decoration:none;font-size:14px}.secondary{display:block;text-align:center;margin-top:12px;text-decoration:none;color:#344054;border:1px solid #d0d5dd;padding:13px;border-radius:10px}.msg{display:none;margin-top:18px;padding:13px;border-radius:10px;font-size:14px;line-height:1.5}.msg.show{display:block}.ok{background:#ecfdf3;color:#067647}.err{background:#fef3f2;color:#b42318}.home{display:inline-block;margin-bottom:25px;color:#635bff;text-decoration:none;font-weight:600}.small{font-size:12px;color:#98a2b3;margin-top:16px}</style></head><body><main class="card"><a class="home" href="index.html">← Web3Market</a><h1>Welcome back</h1><p>Sign in with your Web3Market email and password.</p><form id="form" novalidate><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"></div><button id="btn" class="btn" type="submit">Sign in</button></form><a class="link" href="forgot-password.html">Forgot your password?</a><a class="link" id="resend" href="#">Resend confirmation email</a><div id="msg" class="msg" role="status" aria-live="polite"></div><a class="secondary" href="register.html">Create a new account</a><p class="small">Your email must be confirmed before access to your Web3Market account is allowed.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20260827-loginfix6"></script><script>(function(){const f=document.getElementById('form'),em=document.getElementById('email'),pw=document.getElementById('password'),b=document.getElementById('btn'),r=document.getElementById('resend'),m=document.getElementById('msg');const getClient=()=>window.Web3MarketSupabase?.getClient?.()||window.supabaseClient||window.web3marketSupabase||null;const show=(t,o)=>{m.textContent=t;m.className='msg show '+(o?'ok':'err')};async function go(sb){const {data,error}=await sb.auth.getUser();if(error||!data?.user)throw error||new Error('Session could not be loaded.');const u=data.user;const {data:p,error:pe}=await sb.from('profiles').select('role').eq('id',u.id).maybeSingle();if(pe)throw pe;const role=String(p?.role||'').trim().toLowerCase();if(role==='buyer')return location.replace('buyer-dashboard.html');if(role==='seller')return location.replace('seller-dashboard.html');throw new Error('Your account role is missing or invalid.')}async function ready(){for(let i=0;i<30;i++){const sb=getClient();if(sb)return sb;await new Promise(x=>setTimeout(x,100));}return null}f.addEventListener('submit',async e=>{e.preventDefault();const sb=await ready();if(!sb)return show('تعذر الاتصال بويب ثري ماركت. أعد تحميل الصفحة وحاول مرة أخرى.',false);const x=em.value.trim().toLowerCase();if(!x||!pw.value)return show('Please enter your email and password.',false);b.disabled=true;b.textContent='Signing in…';try{const {data,error}=await sb.auth.signInWithPassword({email:x,password:pw.value});if(error)throw error;if(!data?.user?.email_confirmed_at){await sb.auth.signOut();throw new Error('Please confirm your email before signing in.')}await go(sb)}catch(e){console.error('Web3Market login:',e);show(/invalid login credentials/i.test(e.message)?'Incorrect email or password.':e.message||'Sign in failed.',false)}finally{b.disabled=false;b.textContent='Sign in'}});r.addEventListener('click',async e=>{e.preventDefault();const sb=await ready();if(!sb)return show('تعذر الاتصال بويب ثري ماركت.',false);try{const {error}=await sb.auth.resend({type:'signup',email:em.value.trim().toLowerCase(),options:{emailRedirectTo:new URL('login.html',location.href).href}});if(error)throw error;show('Confirmation email sent.',true)}catch(e){show(e.message||'Unable to resend confirmation email.',false)}})})();</script></body></html>
