<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In — Web3Market</title><link rel="stylesheet" href="css/style.css"></head><body><main class="card"><a href="index.html">← Web3Market</a><h1>Welcome back</h1><p>Sign in with your Web3Market email and password.</p><form id="form"><label>Email address</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="btn" type="submit">Sign in</button></form><a href="forgot-password.html">Forgot your password?</a><a id="resend" href="#">Resend confirmation email</a><div id="msg"></div><a href="register.html">Create a new account</a><p>Your email must be confirmed before access is allowed.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.addEventListener('error',e=>console.error('Web3Market login:',e.error||e.message));(async()=>{const URL='https://hzhqlexnhtukfljcvnyd.supabase.co',KEY='sb_publishable_lO7uEsiM0T8oeHB75DMxkA_287VZ9eI',SB=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'web3market-auth'}});window.supabaseClient=SB;const form=document.getElementById('form'),email=document.getElementById('email'),password=document.getElementById('password'),btn=document.getElementById('btn'),msg=document.getElementById('msg'),resend=document.getElementById('resend');const show=(x,ok=false)=>{msg.textContent=x;msg.style.display='block';msg.style.color=ok?'#16a34a':'#dc2626'};async function route(){const {data,error}=await SB.auth.getUser();if(error||!data.user)throw new Error('Session could not be loaded.');const u=data.user;let role=null;try{const r=await SB.from('profiles').select('role').eq('id',u.id).maybeSingle();if(!r.error)role=String(r.data?.role||'').toLowerCase()}catch(e){console.warn(e)}if(role==='buyer')location.href='buyer-dashboard.html';else if(role==='seller')location.href='seller-dashboard.html';else location.href='marketplace.html'}form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Signing in…';try{const em=email.value.trim().toLowerCase(),pw=password.value;if(!em||!pw)throw new Error('Enter your email and password.');const {data,error}=await SB.auth.signInWithPassword({email:em,password:pw});if(error)throw error;if(!data.user?.email_confirmed_at){await SB.auth.signOut();throw new Error('Please confirm your email before signing in.')}await route()}catch(e){console.error('Web3Market sign-in:',e);show(/invalid login credentials/i.test(e.message)?'Incorrect email or password.':e.message||'Sign in failed.')}finally{btn.disabled=false;btn.textContent='Sign in'}});resend.addEventListener('click',async e=>{e.preventDefault();try{const em=email.value.trim().toLowerCase();if(!em)throw new Error('Enter your email first.');const {error}=await SB.auth.resend({type:'signup',email:em,options:{emailRedirectTo:location.href}});if(error)throw error;show('Confirmation email sent.',true)}catch(e){show(e.message||'Unable to resend confirmation email.')}})})()</script></body></html>
