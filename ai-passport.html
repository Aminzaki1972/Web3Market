body{background:#f6f7f9;color:#141820}.passport-wrap{width:min(1120px,92%);margin:0 auto;padding:34px 0 70px}.passport-head{background:#141820;color:#fff;border-radius:24px;padding:30px;margin-bottom:18px}.passport-head h1{margin:0 0 8px;font-size:clamp(30px,5vw,46px)}.passport-head p{margin:0;color:#cbd3df}.passport-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.passport-tools input{flex:1;min-width:220px;height:44px;border:1px solid #dce1e8;border-radius:11px;padding:0 13px}.passport-tools button{height:44px;border:0;border-radius:11px;padding:0 17px;color:#fff;font-weight:800;cursor:pointer;pointer-events:auto}.load{background:#635bff}.external-btn{background:#167348!important;color:#fff!important;cursor:pointer!important;pointer-events:auto!important;opacity:1!important;display:inline-flex!important;align-items:center;justify-content:center;min-height:44px;border:0;position:relative;z-index:1000;user-select:none}.passport-card{background:#fff;border:1px solid #e2e6eb;border-radius:18px;padding:22px;margin-bottom:16px}.passport-card h2{margin:0 0 16px;font-size:19px}.identity{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.item{background:#f8f9fb;border-radius:12px;padding:13px}.item small{display:block;color:#7a8290;font-size:10px;font-weight:800;text-transform:uppercase}.item strong{display:block;margin-top:5px;font-size:13px;word-break:break-word}.status{font-size:10px;font-weight:900;border-radius:999px;padding:5px 8px;background:#eef0f5;display:inline-block;margin-top:7px}.status.ai{background:#e8e5ff;color:#5149db}.status.owner{background:#fff3dc;color:#946000}.status.connected{background:#e4f6ed;color:#167348}.status.external{background:#e8f6ef;color:#167348}.passport-badge{display:inline-block;margin-bottom:12px;padding:7px 11px;border-radius:999px;background:#e8e5ff;color:#5149db;font-weight:900;font-size:12px}.passport-badge.external{background:#e8f6ef;color:#167348}.finding,.source{padding:12px;border:1px solid #e5e8ed;border-radius:12px;margin:9px 0}.finding p{margin:6px 0}.source a{color:#5149db;font-weight:800;word-break:break-all}.muted{color:#737c89}.back{display:inline-block;margin-bottom:14px;font-weight:800;color:#5149db}.passport-monitor{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#141820;color:#fff;border-radius:14px;padding:16px;margin:14px 0}.passport-monitor button{border:0;border-radius:10px;padding:10px 14px;background:#635bff;color:#fff;font-weight:800;cursor:pointer}.passport-monitor select{background:#fff}.passport-monitor a{display:inline-block;padding:10px 14px;border-radius:10px;background:#fff;color:#141820;text-decoration:none;font-weight:800}.monitor-note{font-size:12px;color:#cbd3df;margin-top:4px}@media(max-width:760px){.identity{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.identity{grid-template-columns:1fr}.passport-wrap{padding-top:20px}.passport-monitor{align-items:flex-start;flex-direction:column}}

</head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">W3</span><span>Web3Market</span></a><nav><a href="marketplace.html">Marketplace</a><a href="ai-passport.html">AI Project Passport</a></nav><a class="btn btn-ghost" href="login.html">Sign in</a></header>
<main class="passport-wrap"><a class="back" href="marketplace.html">← Back to Marketplace</a>
<section class="passport-head"><h1>AI Project Passport</h1><p>Analyze Web3Market projects or research any public website or Web3 project without adding it to the marketplace.</p>
<div class="passport-tools"><input id="projectId" autocomplete="off" placeholder="Project ID, project name, or any public website URL"><button id="loadBtn" class="load" type="button">Load Passport</button><button id="externalBtn" class="external-btn" type="button" onclick="window.w3mDirectPassportSearch && window.w3mDirectPassportSearch()">Search Any Website / Web3 Project</button></div></section>
<div id="passport" class="passport-card"><p class="muted">Choose a Web3Market project or search any public Web3 project.</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20260925-passport"></script>
<script src="js/ai-passport.js?v=20261009-search-button-fix"></script>
<script src="js/global-language.js?v=20260923-4"></script>
<script src="/js/brand.js?v=20261007" defer></script>
<script>
window.w3mDirectPassportSearch=async function(){
 const input=document.getElementById('projectId');
 const root=document.getElementById('passport');
 const query=(input?.value||'').trim();
 if(!query){input?.focus();return;}
 const genericQueries=new Set(['finance','financial','finances','crypto','cryptocurrency','cryptocurrencies','blockchain','web3','defi','decentralized finance','nft','nfts','dao','wallet','wallets','exchange','exchanges','dex','dexes','market','marketplace','trading','ai','artificial intelligence','metaverse','token','tokens','protocol','protocols','payments','payment']);
 const normalized=query.toLowerCase().replace(/\\s+/g,' ').trim();
 if(normalized.length<3){root.innerHTML='<p class="muted">Enter a specific Web3 project name or its official website.</p>';return;}
 if(genericQueries.has(normalized)){root.innerHTML='<p class="muted"><strong>Search is too broad.</strong> Enter a specific Web3 project name or its official HTTPS website. Generic names cannot receive a W3M Passport by themselves.</p>';return;}
 if(/^(W3M-\\d{4}-\\d{6}|W3M\\s*Passport)/i.test(query)){root.innerHTML='<p class="muted">W3M Passport serials must be resolved through the Passport Directory.</p>';return;}
 const key='sb_publishable_lO7uEsiM0T8oeHB75DMxkA_287VZ9eI';
 const base='https://hzhqlexnhtukfljcvnyd.supabase.co';
 const btn=document.getElementById('externalBtn');
 if(btn){btn.disabled=true;btn.textContent='Verifying…';}
 root.innerHTML='<p>Checking evidence, eligibility, identity conflicts, and saved Passport status…</p>';
 const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 try{
   // One authoritative server operation: this endpoint researches, validates, persists,
   // and returns the identity in one response. Do not research a second time in the browser.
   const res=await fetch(base+'/functions/v1/external-passport-persist',{
     method:'POST',headers:{apikey:key,'Content-Type':'application/json',Accept:'application/json'},
     body:JSON.stringify({query}),cache:'no-store'
   });
   const raw=await res.text(); let data={}; try{data=raw?JSON.parse(raw):{}}catch{}
   const p=data?.passport||{};
   const code=String(p.w3m_identity_code||'').trim();
   const serial=String(data.serial||'').trim();
   if(res.ok && data.success===true && data.eligible===true && code && serial===code && p.snapshot_id && p.passport_id){
     let html='<div class="passport-card"><h2>'+esc(p.project_name||query)+'</h2>';
     html+='<p><strong>Website:</strong> '+esc(p.website||'Not available')+'</p>';
     html+='<p><strong>Evidence Score:</strong> '+esc(p.evidence_score??'—')+'/100</p>';
     html+='<p><strong>Identity Score:</strong> '+esc(p.identity_score??p.confidence_score??'—')+'/100</p>';
     html+='<p><strong>W3M Passport:</strong> '+esc(code)+'</p>';
     html+='<p><strong>Identity status:</strong> '+esc(p.w3m_identity_status||'unverified')+'</p>';
     html+='<p><strong>Saved snapshot:</strong> '+esc(p.snapshot_id)+'</p>';
     html+='<p class="muted">The server confirmed the saved identity and snapshot.</p></div>';
     const sources=Array.isArray(p.sources)?p.sources:[];
     if(sources.length){html+='<div class="passport-card"><h2>Evidence sources ('+sources.length+')</h2>';for(const s of sources){const url=String(s?.url||'');if(!/^https?:\\/\\//i.test(url))continue;html+='<div class="source"><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.title||url)+'</a><p class="muted">'+esc(s.type||'public source')+'</p></div>';}html+='</div>';}
     root.innerHTML=html;
   }else{
     const eligibility=data?.eligibility||{};
     const reasons=Array.isArray(eligibility.reasons)?eligibility.reasons:[];
     let html='<div class="passport-card"><h2>'+esc(data?.error||'No W3M Passport issued')+'</h2>';
     html+='<p class="muted">The authoritative server did not confirm an eligible, saved Passport. No serial is displayed.</p>';
     if(reasons.length){html+='<ul>';for(const reason of reasons)html+='<li>'+esc(reason)+'</li>';html+='</ul>';}
     if(data?.conflict_status)html+='<p><strong>Identity conflict:</strong> '+esc(data.conflict_status)+'</p>';
     if(!reasons.length&&!data?.error)html+='<p>Please retry after the underlying server response has been investigated.</p>';
     html+='</div>';root.innerHTML=html;
   }
 }catch(e){
   root.innerHTML='<p class="muted">Passport verification failed: '+esc(e?.message||e)+'</p>';
 }finally{
   if(btn){btn.disabled=false;btn.textContent='Search Any Website / Web3 Project';}
 }
};
document.getElementById('projectId')?.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();window.w3mDirectPassportSearch();}});
</script>
</body></html>
