<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Project Passport | Web3Market</title>
<link rel="stylesheet" href="css/marketplace.css">
<style>
body{background:#f6f7f9;color:#141820}.passport-wrap{width:min(1120px,92%);margin:0 auto;padding:34px 0 70px}.passport-head{background:#141820;color:#fff;border-radius:24px;padding:30px;margin-bottom:18px}.passport-head h1{margin:0 0 8px;font-size:clamp(30px,5vw,46px)}.passport-head p{margin:0;color:#cbd3df}.passport-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.passport-tools input{flex:1;min-width:220px;height:44px;border:1px solid #dce1e8;border-radius:11px;padding:0 13px}.passport-tools button{height:44px;border:0;border-radius:11px;padding:0 17px;background:#635bff;color:#fff;font-weight:800}.passport-card{background:#fff;border:1px solid #e2e6eb;border-radius:18px;padding:22px;margin-bottom:16px}.passport-card h2{margin:0 0 16px;font-size:19px}.identity{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.item{background:#f8f9fb;border-radius:12px;padding:13px}.item small{display:block;color:#7a8290;font-size:10px;font-weight:800;text-transform:uppercase}.item strong{display:block;margin-top:5px;font-size:13px;word-break:break-word}.status{font-size:10px;font-weight:900;border-radius:999px;padding:5px 8px;background:#eef0f5;display:inline-block;margin-top:7px}.status.ai{background:#e8e5ff;color:#5149db}.status.owner{background:#fff3dc;color:#946000}.status.connected{background:#e4f6ed;color:#167348}.muted{color:#737c89}.back{display:inline-block;margin-bottom:14px;font-weight:800;color:#5149db}@media(max-width:760px){.identity{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.identity{grid-template-columns:1fr}.passport-wrap{padding-top:20px}}
</style></head>
<body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">W3</span><span>Web3Market</span></a><nav><a href="marketplace.html">Marketplace</a><a href="ai-passport.html">AI Project Passport</a></nav><a class="btn btn-ghost" href="login.html">Sign in</a></header>
<main class="passport-wrap">
<a class="back" href="marketplace.html">← Back to Marketplace</a>
<section class="passport-head"><h1>AI Project Passport</h1><p>One place to understand a Web3 project — structured, time-stamped project intelligence.</p>
<div class="passport-tools"><input id="projectId" placeholder="Paste project ID or open from a project page"><button id="loadBtn">Load Passport</button></div></section>
<div id="passport" class="passport-card"><p class="muted">Select a project to view its passport.</p></div>
</main>
